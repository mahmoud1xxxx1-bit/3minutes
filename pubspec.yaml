name: game
description: "3 Minutes diagnostic host - non Firebase/Ads plugins."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/hidden_pigeon/
    - assets/images/onet_full/
    - assets/mirror_control/
    - assets/thumbnails/
    - assets/ranks/
    - assets/avatars/
