name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '.ci-no-apk-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lvllo-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Build Cloud Functions
        run: npm run --prefix functions build

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Firestore rules
        run: npx --yes firebase-tools@15.25.1 emulators:exec --only firestore --project demo-3minutes "npm run --prefix functions test:rules"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Test
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release -t lib/main_lvllo_app.dart

      - name: Verify generated Google OAuth resources
        if: success()
        run: |
          VALUES_FILE=$(find build android -type f -name values.xml -path '*google-services*' -o -type f -name values.xml -path '*GoogleServices*' | head -1)
          if [ -z "$VALUES_FILE" ]; then
            VALUES_FILE=$(grep -rl 'default_web_client_id' build android | head -1 || true)
          fi
          if [ -z "$VALUES_FILE" ]; then
            echo 'Generated Google Services resource containing default_web_client_id not found'
            exit 1
          fi
          echo "Using $VALUES_FILE"
          cat "$VALUES_FILE"
          grep -F '492486855771-l4881i9c2kmgj0te1dhtgjc0i9av69g6.apps.googleusercontent.com' "$VALUES_FILE"

      - name: Verify APK certificate
        if: success()
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apkcert.txt
          echo "Certificate verified"

      - name: Upload validated debug APK
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: LVL-LOOL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push APK
        if: success()
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk releases/LVL_LOOL_1.0.0.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/LVL_LOOL_1.0.0.apk
          git commit -m "ci: auto-build and upload signed APK" || echo "No changes to commit"
          git push origin HEAD:main || echo "Failed to push"
