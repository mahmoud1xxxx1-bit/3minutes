name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Firebase credentials
        id: auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "mode=service_account" >> "$GITHUB_OUTPUT"
            echo "credentials=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_OUTPUT"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=missing" >> "$GITHUB_OUTPUT"
            echo '::warning::Firebase deployment credentials are not configured. Add FIREBASE_SERVICE_ACCOUNT (preferred) or FIREBASE_TOKEN to repository Actions secrets.'
          fi

      - name: Deploy Firestore rules with service account
        if: steps.auth.outputs.mode == 'service_account'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials }}
        run: npx --yes firebase-tools@15.25.1 deploy --only firestore:rules --project minutes-d7dfc --non-interactive

      - name: Deploy Firestore rules with token
        if: steps.auth.outputs.mode == 'token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@15.25.1 deploy --only firestore:rules --project minutes-d7dfc --token "$FIREBASE_TOKEN" --non-interactive

      - name: Report missing credentials
        if: steps.auth.outputs.mode == 'missing'
        run: echo 'Firestore rules were NOT deployed because Firebase credentials are unavailable to GitHub Actions.'
