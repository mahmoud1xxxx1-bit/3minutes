name: Platform Compile

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Create ephemeral compile-only debug key
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/3minutes-ci-compile.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname 'CN=3 Minutes CI Compile,O=CI,C=US'

      - name: Compile Android debug APK
        env:
          CI_DEBUG_KEYSTORE: /tmp/3minutes-ci-compile.keystore
        run: flutter build apk --debug

      - name: Remove ephemeral key and APK
        if: always()
        run: |
          rm -f /tmp/3minutes-ci-compile.keystore
          rm -rf build/app/outputs/flutter-apk

  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Compile iOS without codesigning
        run: flutter build ios --debug --no-codesign
