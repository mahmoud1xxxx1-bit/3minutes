name: First 8 Direct Archive Preview

on:
  push:
    branches: [preview/first-4-games-web]
    paths:
      - 'preview_sources/games_5_7_clean.b64.*'
      - 'lib/preview_first8_main.dart'
      - '.github/workflows/first8-direct-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: first8-direct-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Restore first four supplied sources
        run: |
          set -euxo pipefail
          rm -rf /tmp/first4-original /tmp/missing_games.tgz /tmp/missing_games.b64
          cat preview_sources/missing_games.b64.00 preview_sources/missing_games.b64.01 preview_sources/missing_games.b64.02a preview_sources/missing_games.b64.02b preview_sources/missing_games.b64.03 preview_sources/missing_games.b64.04 preview_sources/missing_games.b64.05 > /tmp/missing_games.b64
          test "$(wc -c < /tmp/missing_games.b64)" -eq 37996
          base64 -d /tmp/missing_games.b64 > /tmp/missing_games.tgz
          echo "66aff88f745e6748cbde457737ed43bcfc479534d0b0f6bd5034562b676744a3  /tmp/missing_games.tgz" | sha256sum -c -
          mkdir -p /tmp/first4-original
          tar -xzf /tmp/missing_games.tgz -C /tmp/first4-original
          cp /tmp/first4-original/key_escape/key_escape_game.dart lib/features/minigames/presentation/first4/key_escape_game.dart
          cp /tmp/first4-original/key_escape/key_escape_levels.dart lib/features/minigames/presentation/first4/key_escape_levels.dart
          cp /tmp/first4-original/level_devil/level_devil_host.dart lib/features/minigames/presentation/first4/level_devil_host.dart
          cp /tmp/first4-original/level_devil/troll_game.dart lib/features/minigames/presentation/first4/troll_game.dart
          cp /tmp/first4-original/level_devil/troll_engine.dart lib/features/minigames/presentation/first4/troll_engine.dart

      - name: Restore games 5 to 7 from supplied archive
        run: |
          set -euxo pipefail
          rm -rf /tmp/games57 /tmp/games57.tgz /tmp/games57.b64
          cat preview_sources/games_5_7_clean.b64.00 preview_sources/games_5_7_clean.b64.01 preview_sources/games_5_7_clean.b64.02 preview_sources/games_5_7_clean.b64.03 > /tmp/games57.b64
          test "$(wc -c < /tmp/games57.b64)" -eq 21012
          base64 -d /tmp/games57.b64 > /tmp/games57.tgz
          echo "670d58a61abae781273de86e943c453e527218680200ad332d8303dcafc49841  /tmp/games57.tgz" | sha256sum -c -
          mkdir -p /tmp/games57
          tar -xzf /tmp/games57.tgz -C /tmp/games57
          find /tmp/games57 -maxdepth 3 -type f -print
          install -D /tmp/games57/mole_strike/mole_strike_game.dart lib/features/minigames/presentation/mole_strike/mole_strike_game.dart
          install -D /tmp/games57/ninja_slice/ninja_slice_game.dart lib/features/minigames/presentation/ninja_slice/ninja_slice_game.dart
          install -D /tmp/games57/onet_connect/onet_connect_game.dart lib/features/minigames/presentation/onet_connect/onet_connect_game.dart
          test -s lib/features/minigames/presentation/mole_strike/mole_strike_game.dart
          test -s lib/features/minigames/presentation/ninja_slice/ninja_slice_game.dart
          test -s lib/features/minigames/presentation/onet_connect/onet_connect_game.dart

      - run: flutter pub get

      - name: Apply integration-only adapters
        run: |
          python - <<'PY'
          from pathlib import Path
          cup = Path('lib/features/minigames/presentation/first4/follow_the_cup_game.dart')
          s = cup.read_text()
          s = s.replace('late int _ballCupIndex;', 'int _ballCupIndex = 0;')
          s = s.replace('late List<int> _currentPositions;', 'List<int> _currentPositions = <int>[0, 1, 2];')
          s = s.replace('late List<int> _targetPositions;', 'List<int> _targetPositions = <int>[0, 1, 2];')
          cup.write_text(s)

          key = Path('lib/features/minigames/presentation/first4/key_escape_game.dart')
          s = key.read_text()
          s = s.replace("  void _nextPuzzle() {\n    setState(() {", "  void _nextPuzzle() {\n    MinigameEnvironment.of(context).updateScore((((_puzzleInStage + 1) * 1000) / 3).round());\n    setState(() {")
          s = s.replace('score: 100,', 'score: 1000,')
          s = s.replace("'Round ${_puzzleInStage + 1} / 3'", "Localizations.localeOf(context).languageCode == 'ar' ? 'الجولة ${_puzzleInStage + 1} / 3' : 'Round ${_puzzleInStage + 1} / 3'")
          s = s.replace("const Text(\n                          'MOVES',", "Text(\n                          Localizations.localeOf(context).languageCode == 'ar' ? 'الحركات' : 'MOVES',")
          s = s.replace("const Text(\n                          'MISTAKES',", "Text(\n                          Localizations.localeOf(context).languageCode == 'ar' ? 'الأخطاء' : 'MISTAKES',")
          s = s.replace("_roundWon ? 'SOLVED!' : 'FAILED!'", "_roundWon ? (Localizations.localeOf(context).languageCode == 'ar' ? 'تم الحل!' : 'SOLVED!') : (Localizations.localeOf(context).languageCode == 'ar' ? 'فشل!' : 'FAILED!')")
          key.write_text(s)

          find = Path('lib/features/minigames/presentation/first4/find_differences_game.dart')
          s = find.read_text()
          s = s.replace("        child: ClipRRect(\n          borderRadius: BorderRadius.circular(18),\n          child: CustomPaint(\n            painter: _PuzzlePainter(puzzle: puzzle, found: found, altered: altered),\n          ),\n        ),", "        child: ClipRRect(\n          borderRadius: BorderRadius.circular(18),\n          child: SizedBox.expand(\n            child: CustomPaint(\n              painter: _PuzzlePainter(puzzle: puzzle, found: found, altered: altered),\n            ),\n          ),\n        ),")
          find.write_text(s)
          PY

      - name: Analyze first eight preview
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/preview_first8_main.dart lib/features/minigames/presentation/first4 lib/features/minigames/presentation/mole_strike lib/features/minigames/presentation/ninja_slice lib/features/minigames/presentation/onet_connect lib/features/minigames/presentation/shared/minigame_environment.dart

      - name: Build Flutter Web
        run: |
          flutter build web --release -t lib/preview_first8_main.dart --base-href "/"
          sed -i 's#<base href="/">#<base href="./">#' build/web/index.html

      - name: Publish first eight web build
        run: |
          rm -rf /tmp/first8-web && mkdir -p /tmp/first8-web
          cp -R build/web/. /tmp/first8-web/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan first8-web-live
          git rm -rf . || true
          git clean -fdx
          cp -R /tmp/first8-web/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy: first eight games preview (Mirror asset-gated)"
          git push origin HEAD:first8-web-live --force
