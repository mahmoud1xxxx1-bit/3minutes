name: First 4 Games Web Preview

on:
  push:
    branches:
      - preview/first-4-games-web
    paths:
      - 'lib/preview_first4_main.dart'
      - 'lib/features/minigames/presentation/first4/**'
      - 'lib/features/minigames/presentation/shared/minigame_environment.dart'
      - 'preview_sources/**'
      - '.github/workflows/first4-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: first4-web-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Restore supplied original game sources
        run: |
          rm -rf /tmp/first4-original
          mkdir -p /tmp/first4-original
          tar -xzf preview_sources/missing_games.tgz -C /tmp/first4-original
          cp /tmp/first4-original/key_escape/key_escape_game.dart lib/features/minigames/presentation/first4/key_escape_game.dart
          cp /tmp/first4-original/key_escape/key_escape_levels.dart lib/features/minigames/presentation/first4/key_escape_levels.dart
          cp /tmp/first4-original/level_devil/level_devil_host.dart lib/features/minigames/presentation/first4/level_devil_host.dart
          cp /tmp/first4-original/level_devil/troll_game.dart lib/features/minigames/presentation/first4/troll_game.dart
          cp /tmp/first4-original/level_devil/troll_engine.dart lib/features/minigames/presentation/first4/troll_engine.dart
      - run: flutter pub get
      - name: Apply integration-only adapters
        run: |
          python - <<'PY'
          from pathlib import Path

          cup = Path('lib/features/minigames/presentation/first4/follow_the_cup_game.dart')
          s = cup.read_text()
          s = s.replace('late int _ballCupIndex;', 'int _ballCupIndex = 0;')
          s = s.replace('late List<int> _currentPositions;', 'List<int> _currentPositions = <int>[0, 1, 2];')
          s = s.replace('late List<int> _targetPositions;', 'List<int> _targetPositions = <int>[0, 1, 2];')
          cup.write_text(s)

          key = Path('lib/features/minigames/presentation/first4/key_escape_game.dart')
          s = key.read_text()
          s = s.replace(
              "  void _nextPuzzle() {\n    setState(() {",
              "  void _nextPuzzle() {\n    MinigameEnvironment.of(context).updateScore((((_puzzleInStage + 1) * 1000) / 3).round());\n    setState(() {",
          )
          s = s.replace('score: 100,', 'score: 1000,')
          s = s.replace(
              "'Round ${_puzzleInStage + 1} / 3'",
              "Localizations.localeOf(context).languageCode == 'ar' ? 'الجولة ${_puzzleInStage + 1} / 3' : 'Round ${_puzzleInStage + 1} / 3'",
          )
          s = s.replace("const Text(\n                          'MOVES',", "Text(\n                          Localizations.localeOf(context).languageCode == 'ar' ? 'الحركات' : 'MOVES',")
          s = s.replace("const Text(\n                          'MISTAKES',", "Text(\n                          Localizations.localeOf(context).languageCode == 'ar' ? 'الأخطاء' : 'MISTAKES',")
          s = s.replace("_roundWon ? 'SOLVED!' : 'FAILED!'", "_roundWon ? (Localizations.localeOf(context).languageCode == 'ar' ? 'تم الحل!' : 'SOLVED!') : (Localizations.localeOf(context).languageCode == 'ar' ? 'فشل!' : 'FAILED!')")
          key.write_text(s)
          PY
      - name: Analyze preview source
        run: flutter analyze lib/preview_first4_main.dart lib/features/minigames/presentation/first4 lib/features/minigames/presentation/shared/minigame_environment.dart
      - name: Build Flutter Web
        run: |
          flutter build web --release -t lib/preview_first4_main.dart --base-href "/"
          sed -i 's#<base href="/">#<base href="./">#' build/web/index.html
      - name: Publish immutable web build branch
        run: |
          rm -rf /tmp/first4-web
          mkdir -p /tmp/first4-web
          cp -R build/web/. /tmp/first4-web/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan first4-web-live
          git rm -rf . || true
          git clean -fdx
          cp -R /tmp/first4-web/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy: original first four games Flutter Web"
          git push origin HEAD:first4-web-live --force
