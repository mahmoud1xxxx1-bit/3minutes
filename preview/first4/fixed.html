<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>3 Minutes · First 4 Games Preview</title>
<style>html,body,#preview{margin:0;width:100%;height:100%;border:0;background:#01030a;overflow:hidden}#preview{display:block}</style>
</head>
<body>
<iframe id="preview" src="index.html" allow="fullscreen"></iframe>
<script>
const frame=document.getElementById('preview');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow;
  if(!w) return;
  w.startCountdown=function(){
    w.show('countScreen');
    const el=w.document.getElementById('countValue');
    let finished=false;
    const go=()=>{if(finished)return;finished=true;try{w.startMatch()}catch(e){console.error(e)}};
    const step=(value,delay)=>setTimeout(()=>{
      if(finished)return;
      el.textContent=value;
      el.style.animation='none';
      void el.offsetWidth;
      el.style.animation='pulse .65s both';
    },delay);
    el.textContent='3';
    step('2',700);
    step('1',1400);
    setTimeout(go,2100);
    setTimeout(go,3200);
  };
});
</script>
</body>
</html>
