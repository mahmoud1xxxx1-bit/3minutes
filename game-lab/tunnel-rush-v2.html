<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Tunnel Rush V2 - Game Lab</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#06101d;color:#eef7ff;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;overflow:hidden}body{display:flex;justify-content:center;background:radial-gradient(circle at 50% 5%,#17304f 0,#081523 38%,#03070d 100%)}
.shell{width:min(100vw,720px);height:100dvh;display:flex;flex-direction:column;padding:10px;gap:8px}.top{display:flex;justify-content:space-between;align-items:center;direction:ltr}.pill{padding:7px 11px;border:1px solid #2d5578;border-radius:999px;background:#0a1830cc;color:#a9bfd7;font-size:11px;font-weight:900}.pill b{color:#5deeff}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{border:1px solid #244665;border-radius:15px;background:#0b1930cc;text-align:center;padding:7px}.stat b{display:block;font-size:20px;color:#6cf3ff}.stat span{font-size:9px;color:#8ea7c3;font-weight:800}.stage{position:relative;flex:1;min-height:420px;border-radius:26px;overflow:hidden;border:1px solid #244a6d;background:#02050a;box-shadow:inset 0 0 80px #000,0 20px 45px #0008;touch-action:none}canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#020812d8;z-index:5;padding:18px}.card{width:min(390px,94%);background:linear-gradient(180deg,#10223c,#081426);border:1px solid #2d5578;border-radius:24px;padding:20px;text-align:center;box-shadow:0 25px 70px #000}.title{font-weight:1000;font-size:30px}.title em{font-style:normal;color:#45eaff}.desc{font-size:12px;color:#a0b4ca;line-height:1.7;margin:8px 0 14px}.row{display:flex;gap:7px;direction:ltr}.row input,.row select{min-width:0;flex:1;padding:9px;border-radius:11px;border:1px solid #294d70;background:#07162a;color:white}.play{margin-top:9px;width:100%;height:50px;border:0;border-radius:15px;background:linear-gradient(90deg,#17dbea,#78f5ff);font-size:16px;font-weight:1000;color:#021019}.hint{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:#05101dcc;border:1px solid #244865;color:#9bb2ca;font-size:10px;font-weight:800;pointer-events:none;white-space:nowrap}.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:#ff355144}.flash.on{animation:f .22s}@keyframes f{50%{opacity:1}}.msg{position:absolute;top:16%;left:50%;transform:translate(-50%,-50%);padding:7px 12px;border-radius:999px;background:#05101ddd;border:1px solid #2b5073;font-weight:1000;font-size:12px;opacity:0;transition:.15s}.msg.show{opacity:1}.msg.good{color:#64ffbe;border-color:#2a8e67}.msg.bad{color:#ff758c;border-color:#8b3244}.brand{font-size:9px;color:#7088a6;text-align:center}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div class="pill">Tunnel Rush <b>V2</b></div><div class="pill">Experimental · Game Lab</div></div>
  <div class="hud"><div class="stat"><b id="time">20.0</b><span>الوقت</span></div><div class="stat"><b id="passed">0</b><span>عوائق تم تجاوزها</span></div><div class="stat"><b id="fam">F01</b><span>الخوارزمية</span></div></div>
  <div class="stage" id="stage"><canvas id="c"></canvas><div class="msg" id="msg"></div><div class="flash" id="flash"></div><div class="hint">اسحب المركبة حول النفق لتدخل من الفتحات</div>
    <div class="overlay" id="overlay"><div class="card"><div class="title">TUNNEL <em>RUSH</em></div><div class="desc">اندفع داخل النفق وتجنب العوائق الدوارة. حرّك المركبة بالسحب أو الماوس. الهدف: البقاء حتى نهاية 20 ثانية.</div><div class="row"><input id="seed" value="2048" inputmode="numeric"><select id="diff"><option value="0">Normal</option><option value="1">Hard</option><option value="2">Expert</option></select></div><button class="play" id="play">ابدأ التجربة</button></div></div>
  </div>
  <div class="brand">Prototype only · لا يتم دمجها في التطبيق قبل الاعتماد</div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
const timeEl=document.getElementById('time'),passedEl=document.getElementById('passed'),famEl=document.getElementById('fam');
const overlay=document.getElementById('overlay'),play=document.getElementById('play'),seedInput=document.getElementById('seed'),diffSel=document.getElementById('diff'),msg=document.getElementById('msg'),flash=document.getElementById('flash');
let W=1,H=1,DPR=1,running=false,last=0,elapsed=0,passed=0,hits=0,seed=1,diff=0,family=0,playerAngle=Math.PI/2,targetAngle=Math.PI/2,obstacles=[];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function hash(x){x|=0;x=Math.imul(x^x>>>16,0x45d9f3b);x=Math.imul(x^x>>>16,0x45d9f3b);return (x^x>>>16)>>>0}function rand(){seed=hash(seed+0x9e3779b9);return seed/4294967296}
const TAU=Math.PI*2;
function wrap(a){a%=TAU;if(a<0)a+=TAU;return a}function angDiff(a,b){let d=wrap(a)-wrap(b);if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d}
const types=['gate','arc','cross','shutters','triple'];
function createObstacle(index){const t=types[(family+index*3)%types.length];let gap=0.72-(diff*.08);if(t==='cross')gap=.86-(diff*.06);if(t==='triple')gap=.62-(diff*.05);const gapAngle=rand()*TAU;const spin=(rand()<.5?-1:1)*(0.35+rand()*.65+diff*.18);const o={type:t,z:1.28,angle:rand()*TAU,gapAngle,gap,spin,checked:false,index};validate(o);return o}
function validate(o){if(!(o.gap>0.42&&o.gap<1.2))throw Error('invalid gap');if(!Number.isFinite(o.spin)||!Number.isFinite(o.gapAngle))throw Error('invalid obstacle')}
function reset(){seed=(parseInt(seedInput.value,10)||1)>>>0;diff=+diffSel.value||0;family=hash(seed)%50;famEl.textContent='F'+String(family+1).padStart(2,'0');elapsed=0;passed=0;hits=0;playerAngle=Math.PI/2;targetAngle=playerAngle;obstacles=[];passedEl.textContent='0';timeEl.textContent='20.0';for(let i=0;i<4;i++){const o=createObstacle(i);o.z=1.08+i*.42;obstacles.push(o)}running=true;overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function playerRadius(){return Math.min(W,H)*.29}
function project(z){const p=Math.max(0,Math.min(1,1-(z-.05)/1.45));return {s:.06+p*.98,alpha:.18+p*.82}}
function collision(o){const d=Math.abs(angDiff(playerAngle,o.gapAngle+o.angle));return d>o.gap*.5}
function message(text,ok){msg.textContent=text;msg.className='msg show '+(ok?'good':'bad');clearTimeout(message.t);message.t=setTimeout(()=>msg.className='msg',380)}
function update(dt){elapsed+=dt;timeEl.textContent=Math.max(0,20-elapsed).toFixed(1);if(elapsed>=20){finish();return}targetAngle=wrap(targetAngle);playerAngle=wrap(playerAngle+angDiff(targetAngle,playerAngle)*Math.min(1,dt*11));const speed=.39+diff*.055+Math.min(.12,elapsed*.006);for(const o of obstacles){o.z-=speed*dt;o.angle=wrap(o.angle+o.spin*dt);if(!o.checked&&o.z<.11){o.checked=true;if(collision(o)){hits++;flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');message('اصطدام!',false)}else{passed++;passedEl.textContent=passed;message('نجحت!',true)}}}obstacles=obstacles.filter(o=>o.z>-.12);while(obstacles.length<5){const idx=passed+hits+obstacles.length+Math.floor(elapsed*2);const o=createObstacle(idx);o.z=obstacles.length?Math.max(...obstacles.map(x=>x.z))+.38:1.25;obstacles.push(o)}}
function tunnel(){const cx=W/2,cy=H*.46,maxR=Math.hypot(W,H)*.62;ctx.fillStyle='#02050a';ctx.fillRect(0,0,W,H);const grad=ctx.createRadialGradient(cx,cy,4,cx,cy,maxR);grad.addColorStop(0,'#18233b');grad.addColorStop(.18,'#101629');grad.addColorStop(.58,'#261821');grad.addColorStop(1,'#05070b');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(cx,cy);for(let i=0;i<20;i++){const a=i/20*TAU+elapsed*.06;ctx.strokeStyle='rgba(58,203,238,.10)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(Math.cos(a)*8,Math.sin(a)*8);ctx.lineTo(Math.cos(a)*maxR,Math.sin(a)*maxR);ctx.stroke()}for(let i=0;i<15;i++){const t=((i/15+elapsed*.23)%1);const r=8+t*t*maxR;ctx.strokeStyle=`rgba(67,193,225,${.05+t*.08})`;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,r,r*.74,0,0,TAU);ctx.stroke()}ctx.restore()}
function drawObstacle(o){const p=project(o.z),cx=W/2,cy=H*.46,maxR=Math.min(W,H)*.61*p.s;ctx.save();ctx.translate(cx,cy);ctx.rotate(o.angle);ctx.globalAlpha=p.alpha;ctx.lineCap='round';const gapCenter=o.gapAngle;const base='#6b42d8',green='#26ad62';function arcBlock(start,end,width,col){ctx.strokeStyle=col;ctx.lineWidth=width;ctx.beginPath();ctx.arc(0,0,maxR*.72,start,end);ctx.stroke()}
ctx.shadowBlur=18*p.s;ctx.shadowColor='#6b42d8';if(o.type==='gate'){const w=maxR*.56,h=maxR*.95;ctx.fillStyle=green;ctx.strokeStyle='#50e28f';ctx.lineWidth=Math.max(2,4*p.s);ctx.fillRect(-w*.5,-h*.5,w*.44,h);ctx.fillRect(w*.06,-h*.5,w*.44,h);ctx.strokeRect(-w*.5,-h*.5,w*.44,h);ctx.strokeRect(w*.06,-h*.5,w*.44,h);ctx.rotate(gapCenter-Math.PI/2)}else if(o.type==='arc'){for(let k=0;k<3;k++){const off=k*TAU/3;arcBlock(off+o.gap*.55,off+TAU/3-o.gap*.55,Math.max(10,maxR*.22),k%2?green:base)}}else if(o.type==='cross'){ctx.rotate(gapCenter);ctx.fillStyle=base;for(let k=0;k<4;k++){ctx.save();ctx.rotate(k*Math.PI/2);ctx.fillRect(maxR*.18,-maxR*.10,maxR*.62,maxR*.20);ctx.restore()}}else if(o.type==='shutters'){ctx.rotate(gapCenter);ctx.fillStyle=green;for(let k=0;k<2;k++){ctx.save();ctx.rotate(k*Math.PI);ctx.beginPath();ctx.moveTo(maxR*.12,-maxR*.7);ctx.lineTo(maxR*.78,-maxR*.2);ctx.lineTo(maxR*.78,maxR*.2);ctx.lineTo(maxR*.12,maxR*.18);ctx.closePath();ctx.fill();ctx.restore()}}else{for(let k=0;k<3;k++){ctx.save();ctx.rotate(k*TAU/3+gapCenter);ctx.fillStyle=k===0?green:base;ctx.fillRect(maxR*.18,-maxR*.12,maxR*.58,maxR*.24);ctx.restore()}}ctx.shadowBlur=0;ctx.restore()}
function ship(){const cx=W/2,cy=H*.46,r=playerRadius(),x=cx+Math.cos(playerAngle)*r,y=cy+Math.sin(playerAngle)*r*.72;ctx.save();ctx.translate(x,y);ctx.rotate(playerAngle-Math.PI/2);const s=Math.min(W,H)/520;ctx.shadowColor='#76ffd0';ctx.shadowBlur=20;ctx.fillStyle='#57d69a';ctx.beginPath();ctx.moveTo(0,-25*s);ctx.lineTo(22*s,22*s);ctx.lineTo(0,12*s);ctx.lineTo(-22*s,22*s);ctx.closePath();ctx.fill();ctx.fillStyle='#c8fff0';ctx.beginPath();ctx.moveTo(0,-13*s);ctx.lineTo(8*s,12*s);ctx.lineTo(-8*s,12*s);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,7*s,5*s,0,TAU);ctx.fill();ctx.restore()}
function draw(){tunnel();const sorted=[...obstacles].sort((a,b)=>b.z-a.z);for(const o of sorted)drawObstacle(o);ship()}
function loop(now){if(!running)return;const dt=Math.min(.035,(now-last)/1000||.016);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}
function finish(){running=false;overlay.style.display='flex';overlay.querySelector('.title').innerHTML='النتيجة <em>'+passed+'</em>';overlay.querySelector('.desc').textContent='تجاوزت '+passed+' عائقًا واصطدمت '+hits+' مرة. غيّر Seed أو الصعوبة وأعد التجربة.';play.textContent='إعادة التجربة'}
function pointer(e){const r=stage.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left,y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;const dx=x-W/2,dy=(y-H*.46)/.72;targetAngle=Math.atan2(dy,dx)}
stage.addEventListener('pointerdown',e=>{if(running)pointer(e)});stage.addEventListener('pointermove',e=>{if(running&&e.buttons)pointer(e)});stage.addEventListener('touchstart',e=>{if(running){e.preventDefault();pointer(e)}},{passive:false});stage.addEventListener('touchmove',e=>{if(running){e.preventDefault();pointer(e)}},{passive:false});addEventListener('keydown',e=>{if(!running)return;if(e.key==='ArrowLeft'||e.key==='a')targetAngle-=.35;if(e.key==='ArrowRight'||e.key==='d')targetAngle+=.35});play.addEventListener('click',reset);draw();
})();
</script>
</body></html>
