:.86,up:.98,pair:1.10,burst:.66},{id:'wave',gap:.96,up:1.08,pair:1.06,burst:.72}];const VARIANTS=Array.from({length:48},(_,i)=>{const route=ROUTES[i%8],tempo=TEMPOS[(i/8)|0];return{id:'F'+String(i+1).padStart(2,'0')+' • '+route.id+' • '+tempo.id,route:i%8,tempo:(i/8)|0,gap:tempo.gap,up:tempo.up,pair:tempo.pair,burst:tempo.burst}});function validateFamilies(){if(VARIANTS.length!==48||ROUTES.length!==8||TEMPOS.length!==6)throw new Error('family-count');ROUTES.forEach((r,ri)=>{if(!Array.isArray(r.seq)||r.seq.length<9)throw new Error('route-length-'+ri);for(let i=0;i<r.seq.length;i++){const h=r.seq[i];if(!Number.isInteger(h)||h<0||h>8)throw new Error('route-hole-'+ri);if(i&&r.seq[i-1]===h)throw new Error('route-repeat-'+ri)}});return true}validateFamilies();");t=t.replace("function pickHole(exclude=[]){for(let k=0;k<20;k++){const i=rng.int(9);if(i!==last&&!exclude.includes(i)){last=i;return i}}return rng.int(9)}","function pickHole(exclude=[]){const route=ROUTES[variant.route],offset=(seed>>>3)%route.seq.length;for(let k=0;k<route.seq.length*2;k++){const pos=(step+k+offset)%route.seq.length,i=route.seq[pos];if(i!==last&&!exclude.includes(i)&&i!==activeFake){last=i;return i}}for(let i=0;i<9;i++)if(i!==last&&!exclude.includes(i)&&i!==activeFake){last=i;return i}throw new Error('no-valid-hole')}");t=t.replace("function nextDelay(){const c=cfg();let min=c.min,max=c.max;if(variant.id==='calm-then-rush'&&step>4){min=Math.round(min*.72);max=Math.round(max*.74)}if(variant.id==='burst'&&step%4===3){min=Math.round(min*.52);max=Math.round(max*.60)}return min+rng.int(Math.max(1,max-min+1))}","function nextDelay(){const c=cfg(),tempo=TEMPOS[variant.tempo];let min=c.min,max=c.max;if(tempo.id==='wave'){const f=step%6<3?1.08:.72;min=Math.round(min*f);max=Math.round(max*f)}else if(tempo.id==='pulse'&&step%3===2){min=Math.round(min*.68);max=Math.round(max*.74)}else if((tempo.id==='burst'||tempo.id==='rush')&&step%4===3){min=Math.round(min*tempo.burst);max=Math.round(max*tempo.burst)}else if(tempo.id==='decoy'&&step%5===4){min=Math.round(min*.76);max=Math.round(max*.82)}return min+rng.int(Math.max(1,max-min+1))}");t=t.replace("function spawnWave(){if(activeReal!==null)return;const c=cfg(),real=pickHole();warn(real);timeouts.push(setTimeout(()=>show(real,false,c.up),85));const paired=rng.float()<c.pair;if(paired){const fake=pickHole([real]);const lag=c.lag[0]+rng.int(c.lag[1]-c.lag[0]+1);warn(fake);timeouts.push(setTimeout(()=>show(fake,true,Math.round(c.up*.96)),85+lag))}else if(rng.float()<c.fake){const fake=pickHole([real]);warn(fake);timeouts.push(setTimeout(()=>show(fake,true,Math.round(c.up*.92)),85+(90+rng.int(70))))}step++}","function spawnWave(){if(activeReal!==null)return;const c=cfg(),real=pickHole();if(real<0||real>8)throw new Error('invalid-real');warn(real);timeouts.push(setTimeout(()=>show(real,false,c.up),85));const paired=rng.float()<c.pair;if(paired||rng.float()<c.fake){const fake=pickHole([real]);if(fake===real||fake<0||fake>8)throw new Error('invalid-decoy');const lag=paired?c.lag[0]+rng.int(c.lag[1]-c.lag[0]+1):90+rng.int(70),life=Math.round(c.up*(paired?0.96:0.92));warn(fake);timeouts.push(setTimeout(()=>show(fake,true,life),85+lag))}step++}");t=t.replace("<span class=\"badge\">⚡ نفس Seed = نفس الجولة</span>","<span class=\"badge\">⚡ 48 عائلة صحيحة • نفس Seed = نفس الجولة</span>");t=t.replace("ظهور مزدوج بفارق زمني صغير، مع هدف حقيقي واحد فقط للحفاظ على التحدي.","12 إصابة • 48 عائلة deterministic • هدف حقيقي واحد في كل موجة مع Decoy منفصل.");t=t.replace("$('title').textContent='MOLE STRIKE V4'","$('title').textContent='MOLE STRIKE V6'");document.open();document.write(t);document.close()}).catch(e=>{document.getElementById('loading').textContent='تعذر تحميل النسخة التجريبية. أعد فتح الرابط.';console.error(e)})</script></body></html>
