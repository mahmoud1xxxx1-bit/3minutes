<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tunnel Rush V6</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#05070c;color:#eef7ff;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif}.app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#19253b,#080e18 42%,#030509)}.hud{padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:10}.pill{background:#091326dc;border:1px solid #274563;border-radius:14px;padding:7px;text-align:center}.pill b{display:block;font-size:18px;color:#7af4ff}.pill span{font-size:9px;color:#93a8c3;font-weight:800}.stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;z-index:30;background:#02060eea;display:flex;align-items:center;justify-content:center;padding:22px}.overlay.hidden{display:none}.card{width:min(400px,94vw);padding:22px;border-radius:24px;background:linear-gradient(180deg,#10213b,#071426);border:1px solid #2c5075;text-align:center;box-shadow:0 30px 90px #000c}.title{font-size:29px;font-weight:1000}.title em{font-style:normal;color:#57efff}.desc{font-size:13px;line-height:1.8;color:#9db1ca;margin:9px 0 15px}.row{display:flex;gap:8px;direction:ltr}.row input,.row select{flex:1;min-width:0;background:#071426;border:1px solid #294b6c;border-radius:12px;padding:10px;color:#fff}.play{margin-top:10px;width:100%;height:52px;border:0;border-radius:16px;background:linear-gradient(90deg,#1adbea,#78f5ff);font-size:16px;font-weight:1000;color:#03111d}.legend{display:flex;justify-content:center;gap:8px;margin-top:12px}.dot{width:18px;height:18px;border-radius:50%;border:2px solid #fff4}.tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:12;padding:8px 14px;border-radius:999px;background:#07131fdd;border:1px solid #285173;color:#b9c9dc;font-size:11px;font-weight:800;white-space:nowrap}.toast{position:absolute;left:50%;top:14%;transform:translate(-50%,-50%);z-index:18;opacity:0;padding:8px 14px;border-radius:999px;background:#07111ddd;border:1px solid #2d506f;font-weight:1000;transition:.14s}.toast.show{opacity:1}.toast.good{color:#6affbd}.toast.bad{color:#ff7188}.flash{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0;transition:.12s}.flash.good{background:#34ffaf1c}.flash.bad{background:#ff385424}.flash.show{opacity:1}.result{font-size:32px;font-weight:1000;color:#72f4ff;margin:8px 0}
</style></head><body><div class="app"><div class="hud"><div class="pill"><b id="time">20.0</b><span>الوقت</span></div><div class="pill"><b id="hits">0/12</b><span>الصحيح</span></div><div class="pill"><b id="mistakes">0</b><span>الأخطاء</span></div><div class="pill"><b id="family">F01</b><span>الخوارزمية</span></div></div><div class="stage" id="stage"><canvas id="game"></canvas><div class="flash" id="flash"></div><div class="toast" id="toast"></div><div class="tip">اسحب المركبة داخل النفق • المس لونها فقط</div><div class="overlay" id="overlay"><div class="card" id="card"><div class="title">TUNNEL <em>RUSH V6</em></div><div class="desc">اختر المسار بسرعة داخل النفق. مركبتك لها لون ثابت، والمطلوب لمس <b>12 هدفًا من اللون نفسه</b>. لمس لون مختلف = خطأ.</div><div class="row"><input id="seed" value="314159" inputmode="numeric"><select id="difficulty"><option value="0">Normal</option><option value="1">Hard</option><option value="2">Expert</option></select></div><button class="play" id="play" type="button">ابدأ التجربة</button><div class="legend" id="legend"></div></div></div></div></div><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),overlay=document.getElementById('overlay'),card=document.getElementById('card'),timeEl=document.getElementById('time'),hitsEl=document.getElementById('hits'),mistEl=document.getElementById('mistakes'),famEl=document.getElementById('family'),toast=document.getElementById('toast'),flash=document.getElementById('flash'),legend=document.getElementById('legend');
const COLORS=['#22d98b','#31b7ff','#ff4f72','#ffcc4a'];let W=1,H=1,DPR=1,cx=0,cy=0,running=false,last=0,remain=20,hits=0,mist=0,family=0,targetColor=0,difficulty=0,rnd=Math.random,wave=0,spawnClock=0,targets=[],ship={x:0,y:.58,tx:0,ty:.58},pointer=false,shake=0;
function resize(){DPR=Math.min(devicePixelRatio||1,1.7);W=stage.clientWidth;H=stage.clientHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);cx=W/2;cy=H*.44}
function rngFactory(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296}}
function proj(x,y,z){const near=4.2,fov=Math.min(W,H)*.80;const zz=Math.max(near,z);const k=fov/zz;return{x:cx+x*k,y:cy+y*k,k}}
function feedback(ok){toast.textContent=ok?'مطابق! +1':'لون خاطئ!';toast.className='toast show '+(ok?'good':'bad');flash.className='flash show '+(ok?'good':'bad');setTimeout(()=>{toast.className='toast';flash.className='flash'},180);if(!ok)shake=.18}
function spawnWave(){const z=42;const spread=[2.7,2.45,2.2][difficulty];const slots=[[-spread,-.9],[0,-1.2],[spread,-.9]];const correct=(rnd()*3)|0,used=new Set();for(let i=0;i<3;i++){let ci;if(i===correct)ci=targetColor;else{do{ci=(rnd()*4)|0}while(ci===targetColor||used.has(ci));used.add(ci)}const sx=slots[i][0]+(rnd()-.5)*.35,sy=slots[i][1]+(rnd()-.5)*.3;targets.push({x:sx,y:sy,z:z+i*.5,color:ci,kind:(family+wave+i)%4,spin:rnd()*Math.PI*2,checked:false})}wave++}
function update(dt){remain-=dt;spawnClock-=dt;if(spawnClock<=0){spawnWave();spawnClock=[1.02,.86,.72][difficulty]}ship.x+=(ship.tx-ship.x)*Math.min(1,dt*9);ship.y+=(ship.ty-ship.y)*Math.min(1,dt*9);const speed=[20,24,28][difficulty];for(let i=targets.length-1;i>=0;i--){const t=targets[i];t.z-=speed*dt;t.spin+=dt*(.6+difficulty*.18);if(!t.checked&&t.z<5.2){t.checked=true;const dx=t.x-ship.x*3.2,dy=t.y-ship.y*2.5;if(Math.hypot(dx,dy)<1.05){const ok=t.color===targetColor;if(ok)hits++;else mist++;feedback(ok);hitsEl.textContent=hits+'/12';mistEl.textContent=mist;if(hits>=12){finish(true);return}}}if(t.z<3.4)targets.splice(i,1)}timeEl.textContent=Math.max(0,remain).toFixed(1);if(remain<=0)finish(false)}
function poly(points,fill,stroke,lw=1){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function drawTunnel(now){ctx.fillStyle='#02050a';ctx.fillRect(0,0,W,H);const ox=shake>0?(rnd()-.5)*9:0,oy=shake>0?(rnd()-.5)*9:0;ctx.save();ctx.translate(ox,oy);const sides=8,depths=18,baseZ=5,step=2.7,scroll=(now*.001*[4.0,4.8,5.6][difficulty])%step;let prev=null;for(let j=0;j<depths;j++){const z=baseZ+j*step-scroll;const ring=[];for(let i=0;i<sides;i++){const a=Math.PI/8+i*Math.PI*2/sides;ring.push(proj(Math.cos(a)*5.4,Math.sin(a)*3.5,z))}if(prev){for(let i=0;i<sides;i++){const n=(i+1)%sides;const shade=(i%2===0)?'rgba(20,33,54,.55)':'rgba(40,28,46,.48)';poly([prev[i],prev[n],ring[n],ring[i]],shade,'rgba(70,120,150,.14)',.7)}}ctx.strokeStyle=`rgba(55,150,195,${.09+(depths-j)/depths*.18})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ring[0].x,ring[0].y);for(let i=1;i<ring.length;i++)ctx.lineTo(ring[i].x,ring[i].y);ctx.closePath();ctx.stroke();prev=ring}ctx.restore()}
function drawTarget(t){const p=proj(t.x,t.y,t.z);if(p.k<4)return;const s=Math.max(7,1.05*p.k);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(t.spin);ctx.shadowColor=COLORS[t.color];ctx.shadowBlur=Math.min(28,s*.32);ctx.strokeStyle='rgba(255,255,255,.78)';ctx.fillStyle=COLORS[t.color];ctx.lineWidth=Math.max(1.2,s*.055);if(t.kind===0){ctx.fillRect(-s*.7,-s*.22,s*1.4,s*.44);ctx.strokeRect(-s*.7,-s*.22,s*1.4,s*.44)}else if(t.kind===1){ctx.beginPath();ctx.arc(0,0,s*.47,0,Math.PI*2);ctx.lineWidth=Math.max(4,s*.16);ctx.strokeStyle=COLORS[t.color];ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(0,0,s*.29,0,Math.PI*2);ctx.stroke()}else if(t.kind===2){ctx.beginPath();ctx.moveTo(0,-s*.56);ctx.lineTo(s*.5,0);ctx.lineTo(0,s*.56);ctx.lineTo(-s*.5,0);ctx.closePath();ctx.fill();ctx.stroke()}else{ctx.beginPath();ctx.roundRect(-s*.5,-s*.35,s,s*.7,s*.14);ctx.fill();ctx.stroke()}ctx.restore()}
function drawShip(){const x=cx+ship.x*W*.31,y=H*.79+ship.y*H*.08;const s=Math.min(W,H)*.065;ctx.save();ctx.translate(x,y);ctx.shadowColor=COLORS[targetColor];ctx.shadowBlur=22;ctx.fillStyle=COLORS[targetColor];ctx.strokeStyle='#efffff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-s*.9);ctx.lineTo(s*.52,s*.45);ctx.lineTo(s*.18,s*.26);ctx.lineTo(0,s*.72);ctx.lineTo(-s*.18,s*.26);ctx.lineTo(-s*.52,s*.45);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#dffff8';ctx.beginPath();ctx.moveTo(0,s*.72);ctx.lineTo(s*.14,s*1.05);ctx.lineTo(-s*.14,s*1.05);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle='rgba(238,247,255,.84)';ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.fillText('لون المركبة: '+['أخضر','أزرق','أحمر','ذهبي'][targetColor],cx,22)}
function draw(now){drawTunnel(now);targets.slice().sort((a,b)=>b.z-a.z).forEach(drawTarget);drawShip()}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.04,(now-last)/1000||0);last=now;if(running)update(dt);shake=Math.max(0,shake-dt);draw(now)}
function start(){try{const seed=(parseInt(document.getElementById('seed').value,10)||1)>>>0;difficulty=+document.getElementById('difficulty').value||0;rnd=rngFactory(seed);family=seed%50;targetColor=(rnd()*4)|0;remain=20;hits=mist=wave=0;spawnClock=.2;targets=[];ship={x:0,y:.58,tx:0,ty:.58};hitsEl.textContent='0/12';mistEl.textContent='0';famEl.textContent='F'+String(family+1).padStart(2,'0');timeEl.textContent='20.0';legend.innerHTML=COLORS.map((c,i)=>`<span class="dot" style="background:${c};${i===targetColor?`outline:2px solid white;box-shadow:0 0 16px ${c}`:''}"></span>`).join('');overlay.classList.add('hidden');running=true;last=performance.now();document.body.dataset.started='1'}catch(e){alert('START ERROR: '+e.message);console.error(e)}}
function finish(done){if(!running)return;running=false;const score=Math.max(0,hits*1000-mist*350);overlay.classList.remove('hidden');card.innerHTML=`<div class="title">${done?'اكتملت الجولة':'انتهى الوقت'}</div><div class="result">${hits}/12</div><div class="desc">الأخطاء: <b>${mist}</b><br>النتيجة التجريبية: <b>${score}</b><br>Family: F${String(family+1).padStart(2,'0')}</div><button class="play" type="button" onclick="location.reload()">تجربة جديدة</button>`}
function setPointer(e){const r=stage.getBoundingClientRect();ship.tx=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width*.36)));ship.ty=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height*.64)/(r.height*.25)))}stage.addEventListener('pointerdown',e=>{pointer=true;setPointer(e);try{stage.setPointerCapture(e.pointerId)}catch(_){}});stage.addEventListener('pointermove',e=>{if(pointer&&running)setPointer(e)});stage.addEventListener('pointerup',()=>pointer=false);stage.addEventListener('pointercancel',()=>pointer=false);window.addEventListener('keydown',e=>{if(!running)return;if(e.key==='ArrowLeft')ship.tx=Math.max(-1,ship.tx-.18);if(e.key==='ArrowRight')ship.tx=Math.min(1,ship.tx+.18);if(e.key==='ArrowUp')ship.ty=Math.max(-1,ship.ty-.16);if(e.key==='ArrowDown')ship.ty=Math.min(1,ship.ty+.16)});window.addEventListener('resize',resize);document.getElementById('play').onclick=start;resize();legend.innerHTML=COLORS.map(c=>`<span class="dot" style="background:${c}"></span>`).join('');requestAnimationFrame(loop);
})();</script></body></html>
