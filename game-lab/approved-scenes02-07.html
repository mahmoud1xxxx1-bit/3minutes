const cfg=C[S],H=cfg.h,a=document.getElementById('a'),b=document.getElementById('b'),A=a.getContext('2d'),B=b.getContext('2d'),ba=document.getElementById('ba'),bb=document.getElementById('bb'),fe=document.getElementById('found'),me=document.getElementById('mist'),toast=document.getElementById('toast'),dif=document.getElementById('difficulty'),pz=document.getElementById('puzzles');a.width=b.width=W;a.height=b.height=H;ba.style.aspectRatio=bb.style.aspectRatio=W+'/'+H;document.getElementById('title').textContent='اكتشف الفروقات — '+names[S];
let img=new Image(),found=new Set(),mist=0,pi=0,active=[];
function path(g){let p=new Path2D;if(g[0]=='c'){p.arc(...g[1],0,Math.PI*2)}else{p.moveTo(...g[1][0]);for(let i=1;i<g[1].length;i++)p.lineTo(...g[1][i]);p.closePath()}return p}
function draw(){if(!img.naturalWidth)return;A.clearRect(0,0,W,H);B.clearRect(0,0,W,H);A.drawImage(img,0,0,W,H);B.drawImage(img,0,0,W,H);active.forEach(x=>{let g=cfg.g[x.i],p=path(g);B.save();B.globalAlpha=.9;B.fillStyle=g[3][x.v];B.fill(p);B.restore()})}
function prep(){let n=+dif.value||5;active=R[pi].slice(0,n).map((v,i)=>({i,v}));found.clear();mist=0;document.querySelectorAll('.mark').forEach(x=>x.remove());fe.textContent='0/'+n;me.textContent=0;[...pz.children].forEach((e,i)=>e.classList.toggle('active',i==pi));draw()}
function pt(e,c){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function hit(q,ctx){for(let k=0;k<active.length;k++){if(found.has(k))continue;if(ctx.isPointInPath(path(cfg.g[active[k].i]),q.x,q.y))return k}return-1}
function mark(g){[ba,bb].forEach(board=>{let m=document.createElement('div');m.className='mark';m.style.left=g[2][0]/W*100+'%';m.style.top=g[2][1]/H*100+'%';m.style.width=m.style.height='34px';board.appendChild(m)})}
function flash(t,ok){toast.textContent=t;toast.className='toast show '+(ok?'good':'bad');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.className='toast',230)}
function tap(e,c,ctx){let k=hit(pt(e,c),ctx);if(k>=0){found.add(k);mark(cfg.g[active[k].i]);fe.textContent=found.size+'/'+active.length;flash(found.size==active.length?'اكتملت الفروقات':'فرق صحيح',1)}else{me.textContent=++mist;flash('ليس اختلافًا',0)}}
for(let i=0;i<12;i++){let x=document.createElement('button');x.textContent=i+1;x.onclick=()=>{pi=i;prep()};pz.appendChild(x)}prev.onclick=()=>{pi=(pi+11)%12;prep()};next.onclick=()=>{pi=(pi+1)%12;prep()};dif.onchange=prep;a.onpointerdown=e=>tap(e,a,A);b.onpointerdown=e=>tap(e,b,B);
async function load(){let base;if(S==6){let z=[];for(let i=0;i<4;i++)z.push((await fetch('approved-scene06-'+i+'.b64')).text());base=(await Promise.all(z)).join('')}else base=await (await fetch('approved-scene0'+S+'.b64')).text();img.onload=prep;img.src='data:image/webp;base64,'+base.trim()}load().catch(()=>flash('فشل تحميل الرسم',0));
