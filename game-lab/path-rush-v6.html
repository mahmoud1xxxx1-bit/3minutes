:0 0 18px #19DCE8;display:none;transform:translate(-50%,-50%)}.overlay{position:absolute;inset:0;background:#020612dd;display:grid;place-items:center;text-align:center;padding:20px}.overlay.hide{display:none}.flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:34px;font-weight:1000}.flash.good{color:#4DDA9A}.flash.bad{color:#FF667E}</style></head><body><main class="app"><div class="top"><b>3 MINUTES • PATH RUSH V6</b><small>GAME LAB</small></div><section class="panel hud"><span>الجولة <b id="round">0</b>/3</span><span id="diff">NORMAL</span><span id="time">0.0s</span></section><section class="panel controls"><button class="chip on" data-d="normal">Normal</button><button class="chip" data-d="hard">Hard</button><button class="chip" data-d="expert">Expert</button><button class="btn" id="newSeed">نسخة جديدة</button></section><section class="panel"><div class="arena" id="arena"><div class="char"><div class="portrait" id="portrait">🐰</div><div><small>الشخصية</small><b id="characterName">الأرنب</b></div></div><div class="status" id="status">اختر المسار الصحيح</div><div class="starts"><button class="startNode" data-i="0">3</button><button class="startNode" data-i="1">2</button><button class="startNode" data-i="2">1</button></div><svg class="maze" id="maze" viewBox="0 0 430 260" preserveAspectRatio="none"></svg><div class="runner" id="runner"></div><div class="targets" id="targets"></div><div class="flash" id="flash"></div><div class="overlay" id="overlay"><div><h2>PATH RUSH V6</h2><p>3 تحديات متتالية • 12 عائلة مسارات ناعمة ومخادعة</p><button class="btn" id="start">ابدأ التجربة</button><div>SEED <span id="seed"></span></div><div>FAMILY <span id="family"></span></div></div></div></div></section></main><script>class RNG{constructor(s){this.s=s>>>0}next(){this.s=(Math.imul(1664525,this.s)+1013904223)>>>0;return this.s}int(n){return this.next()%n}}const DATA=[{n:'الأرنب',a:'🐰',food:['جزر','🥕'],wrong:[['موز','🍌'],['سمك','🐟'],['لحم','🥩']]},{n:'القرد',a:'🐵',food:['موز','🍌'],wrong:[['جزر','🥕'],['سمك','🐟'],['لحم','🥩']]},{n:'الأسد',a:'🦁',food:['لحم','🥩'],wrong:[['جزر','🥕'],['موز','🍌'],['خيزران','🎋']]},{n:'الباندا',a:'🐼',food:['خيزران','🎋'],wrong:[['سمك','🐟'],['موز','🍌'],['لحم','🥩']]},{n:'القط',a:'🐱',food:['سمك','🐟'],wrong:[['جزر','🥕'],['موز','🍌'],['خيزران','🎋']]},{n:'الكلب',a:'🐶',food:['عظمة','🦴'],wrong:[['جزر','🥕'],['موز','🍌'],['سمك','🐟']]}];const families=[[[[42,0],[85,48],[330,72],[125,120],[300,185],[42,250]],[[215,0],[340,55],[120,95],[315,145],[130,200],[215,250]],[[388,0],[290,50],[90,105],[340,160],[120,205],[388,250]]],[[[42,0],[150,40],[330,78],[210,130],[90,190],[215,250]],[[215,0],[80,50],[300,92],[115,150],[325,205],[388,250]],[[388,0],[300,42],[120,88],[320,145],[80,205],[42,250]]],[[[42,0],[120,45],[340,78],[95,145],[280,200],[388,250]],[[215,0],[350,52],[150,100],[300,155],[120,205],[42,250]],[[388,0],[280,45],[75,92],[330,150],[165,205],[215,250]]],[[[42,0],[245,42],[350,95],[155,145],[80,205],[215,250]],[[215,0],[90,42],[280,85],[355,145],[150,200],[388,250]],[[388,0],[320,50],[110,90],[250,150],[95,205],[42,250]]],[[[42,0],[95,50],[300,90],[355,140],[135,195],[388,250]],[[215,0],[330,48],[125,100],[280,150],[80,205],[42,250]],[[388,0],[250,50],[70,90],[210,145],[345,205],[215,250]]],[[[42,0],[180,42],[320,78],[130,132],[350,190],[42,250]],[[215,0],[330,45],[80,100],[300,150],[120,205],[388,250]],[[388,0],[250,50],[150,90],[340,150],[75,205],[215,250]]],[[[42,0],[320,45],[110,90],[280,145],[85,205],[388,250]],[[215,0],[100,48],[350,95],[150,150],[300,205],[42,250]],[[388,0],[270,42],[80,95],[330,155],[130,205],[215,250]]],[[[42,0],[150,50],[330,92],[110,150],[300,205],[215,250]],[[215,0],[340,45],[85,92],[320,145],[120,205],[388,250]],[[388,0],[285,50],[120,95],[350,150],[90,205],[42,250]]],[[[42,0],[120,50],[350,95],[170,140],[320,195],[388,250]],[[215,0],[330,48],[100,90],[280,150],[75,205],[215,250]],[[388,0],[250,45],[85,95],[340,150],[145,205],[42,250]]],[[[42,0],[300,45],[140,90],[350,145],[100,205],[215,250]],[[215,0],[95,50],[330,88],[125,150],[290,205],[42,250]],[[388,0],[260,45],[75,95],[300,150],[150,205],[388,250]]],[[[42,0],[110,45],[310,90],[90,150],[280,205],[42,250]],[[215,0],[340,50],[130,90],[325,150],[110,205],[215,250]],[[388,0],[300,45],[95,95],[345,150],[140,205],[388,250]]],[[[42,0],[180,45],[350,90],[120,150],[300,205],[388,250]],[[215,0],[320,50],[100,95],[300,150],[90,205],[42,250]],[[388,0],[250,45],[80,88],[330,150],[150,205],[215,250]]]];const names=['soft-cross','loop-left','loop-right','double-cross','late-switch','wide-weave','soft-knot','mirror-weave','center-loop','cross-return','arc-switch','triple-soft'];const cfg={normal:{families:4,travel:1200},hard:{families:8,travel:1000},expert:{families:12,travel:850}};let difficulty='normal',seed=0,rng,challenge,paths=[],roundIndex=0,correct=0,mistakes=0,startedAt=0,ended=true,locked=false,raf=0;const $=id=>document.getElementById(id),maze=$('maze'),runner=$('runner');function randomSeed(){return crypto.getRandomValues(new Uint32Array(1))[0]>>>0}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rng.int(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function roundSeed(){return(seed^Math.imul(roundIndex+1,0x45d9f3b))>>>0}function curve(points){let d=`M ${points[0][0]} ${points[0][1]}`;for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i],my=(a[1]+b[1])/2;d+=` C ${a[0]} ${my}, ${b[0]} ${my}, ${b[0]} ${b[1]}`}return d}function build(){rng=new RNG(roundSeed());const animal=DATA[rng.int(DATA.length)],wrong=shuffle(animal.wrong.map(x=>[...x])).slice(0,2),foods=shuffle([[...animal.food],...wrong]),correctTarget=foods.findIndex(x=>x[0]===animal.food[0]),perm=shuffle([0,1,2]);challenge={animal,foods,correctTarget,perm};$('portrait').textContent=animal.a;$('characterName').textContent=animal.n;const targets=$('targets');targets.innerHTML='';foods.forEach(x=>{const d=document.createElement('div');d.className='target';d.innerHTML=`<div class="icon">${x[1]}</div><small>${x[0]}</small>`;targets.appendChild(d)});draw()}function draw(){maze.innerHTML='';paths=[];const fam=rng.int(cfg[difficulty].families),mirror=rng.int(2)===1,base=families[fam];for(let i=0;i<3;i++){let pts=base[i].map(p=>[...p]);if(mirror)pts=pts.map(p=>[430-p[0],p[1]]);pts[pts.length-1]=[[42,250],[215,250],[388,250]][challenge.perm[i]];const d=curve(pts);for(const cls of ['shadow','route']){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('class',cls);maze.appendChild(p);if(cls==='route')paths.push(p)}}$('family').textContent=names[fam]+(mirror?' • mirror':'')}function setup(newSeed=true){cancelAnimationFrame(raf);ended=true;locked=false;roundIndex=0;correct=0;mistakes=0;if(newSeed)seed=randomSeed();$('seed').textContent=seed;$('diff').textContent=difficulty.toUpperCase();$('round').textContent='0';$('time').textContent='0.0s';runner.style.display='none';document.querySelectorAll('.startNode').forEach(b=>b.className='startNode');build()}function tick(){if(ended)return;$('time').textContent=((performance.now()-startedAt)/1000).toFixed(1)+'s';raf=requestAnimationFrame(tick)}function begin(){setup(false);ended=false;$('overlay').classList.add('hide');$('status').textContent='الجولة 1 من 3 — اختر المسار الصحيح';startedAt=performance.now();tick()}function animatePath(i){return new Promise(resolve=>{const p=paths[i],len=p.getTotalLength(),box=maze.getBoundingClientRect(),arenaBox=$('arena').getBoundingClientRect(),start=performance.now(),dur=cfg[difficulty].travel;p.classList.add('active');runner.style.display='block';function frame(now){const t=Math.min(1,(now-start)/dur),pt=p.getPointAtLength(len*t);runner.style.left=(box.left-arenaBox.left+pt.x/430*box.width)+'px';runner.style.top=(box.top-arenaBox.top+pt.y/260*box.height)+'px';if(t<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)})}async function choose(i){if(ended||locked)return;locked=true;document.querySelectorAll('.startNode').forEach(b=>{b.disabled=true;if(+b.dataset.i===i)b.classList.add('pick')});await animatePath(i);const end=challenge.perm[i],ok=end===challenge.correctTarget;if(ok)correct++;else mistakes++;const targets=document.querySelectorAll('.target');targets[challenge.correctTarget].classList.add('good');if(!ok)targets[end].classList.add('bad');const flash=$('flash');flash.className='flash '+(ok?'good':'bad');flash.textContent=ok?'CORRECT':'WRONG';setTimeout(()=>{flash.textContent='';if(roundIndex<2){roundIndex++;$('round').textContent=roundIndex;runner.style.display='none';document.querySelectorAll('.startNode').forEach(b=>{b.disabled=false;b.className='startNode'});build();$('status').textContent=`الجولة ${roundIndex+1} من 3 — اختر المسار الصحيح`;locked=false}else{ended=true;cancelAnimationFrame(raf);$('round').textContent='3';$('overlay').classList.remove('hide');$('overlay').querySelector('p').innerHTML=`Correct: ${correct}/3 • Mistakes: ${mistakes}`;$('start').textContent='إعادة نفس النسخة'}},500)}document.querySelectorAll('.startNode').forEach(b=>b.onclick=()=>choose(+b.dataset.i));$('start').onclick=begin;$('newSeed').onclick=()=>{setup(true);$('overlay').classList.remove('hide')};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{difficulty=b.dataset.d;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));setup(true);$('overlay').classList.remove('hide')});setup(true);</script></body></html>
