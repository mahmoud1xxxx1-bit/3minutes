<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tunnel Rush V1</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050b14;color:#fff;font-family:system-ui,Segoe UI,Tahoma,sans-serif;overflow:hidden}body{display:flex;justify-content:center}.app{width:min(100vw,520px);height:100dvh;padding:10px;display:flex;flex-direction:column;gap:8px;background:radial-gradient(circle at 50% 0,#173252,#081423 52%,#040912)}.top{display:flex;justify-content:space-between;direction:ltr}.pill{padding:7px 11px;border:1px solid #274b70;border-radius:999px;background:#0b1930;color:#a9bdd6;font-size:12px;font-weight:800}.pill b{color:#75f4ff}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{border:1px solid #234463;border-radius:14px;background:#0b1930;padding:7px;text-align:center}.stat b{display:block;color:#77f4ff;font-size:18px}.stat span{color:#8197b3;font-size:10px}.stage{position:relative;flex:1;border:1px solid #274867;border-radius:26px;overflow:hidden;background:#02070d;min-height:420px;touch-action:none;box-shadow:inset 0 0 80px #000}.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 45%,#0009)}canvas{width:100%;height:100%;display:block}.msg{position:absolute;top:14%;left:50%;transform:translateX(-50%);z-index:5;padding:8px 14px;border-radius:999px;background:#06101ccc;border:1px solid #315a81;font-weight:900;font-size:12px;opacity:0;transition:.15s}.msg.show{opacity:1}.msg.bad{color:#ff6c84;border-color:#8e3446}.msg.good{color:#6cffbd;border-color:#268665}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:ltr}.btn{height:58px;border-radius:17px;border:1px solid #315b84;background:linear-gradient(#133150,#09182d);color:white;font-size:28px;font-weight:900}.btn:active{transform:scale(.98)}.foot{display:flex;gap:7px}.restart{flex:0 0 110px;border:0;border-radius:13px;background:linear-gradient(90deg,#1eddea,#81f6ff);color:#06121e;font-weight:1000}.note{flex:1;border:1px solid #233f5d;border-radius:13px;background:#091427;padding:7px;color:#93a9c4;font-size:10px;text-align:center}.overlay{position:absolute;inset:0;z-index:10;background:#03080fe9;display:flex;align-items:center;justify-content:center;padding:22px}.card{width:min(360px,94%);padding:22px;border-radius:24px;border:1px solid #2c5072;background:linear-gradient(#10223c,#081426);text-align:center;box-shadow:0 28px 80px #000}.title{font-size:34px;font-weight:1000}.title span{color:#2be5f6}.sub{font-size:13px;line-height:1.7;color:#9db0c8;margin:8px 0 14px}.play{width:100%;height:50px;border:0;border-radius:15px;background:linear-gradient(90deg,#1bd9e8,#78f4ff);font-size:16px;font-weight:1000;color:#04121d}.opts{display:flex;gap:7px;margin-top:8px;direction:ltr}.opts input,.opts select{min-width:0;flex:1;background:#08172b;border:1px solid #294c6d;color:#fff;border-radius:10px;padding:8px}.result{font-size:30px;color:#75f4ff;font-weight:1000;margin:8px 0}</style></head><body><div class="app"><div class="top"><div class="pill">TUNNEL RUSH <b>V1</b></div><div class="pill">FAMILY <b id="family">01/50</b></div></div><div class="hud"><div class="stat"><b id="time">20.0</b><span>الوقت</span></div><div class="stat"><b id="passed">0</b><span>بوابات</span></div><div class="stat"><b id="hits">0</b><span>اصطدامات</span></div></div><div class="stage" id="stage"><canvas id="c"></canvas><div class="msg" id="msg"></div><div class="overlay" id="overlay"><div class="card"><div class="title">TUNNEL <span>RUSH</span></div><div class="sub">تحرك بين 3 مسارات وتجنب الأبواب المغلقة لمدة 20 ثانية. يمكنك الضغط أو السحب يمينًا ويسارًا.</div><button class="play" id="play">ابدأ التجربة</button><div class="opts"><input id="seed" type="number" value="12345"><select id="diff"><option value="0">NORMAL</option><option value="1">HARD</option><option value="2">EXPERT</option></select></div></div></div></div><div class="controls"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="foot"><button class="restart" id="restart">إعادة</button><div class="note">نسخة Game Lab تجريبية فقط — لم تُدمج داخل التطبيق</div></div></div><script>(()=>{const cvs=document.getElementById('c'),ctx=cvs.getContext('2d'),stage=document.getElementById('stage');let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;cvs.width=W*dpr;cvs.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();class RNG{constructor(s){this.s=(s>>>0)||1}n(){let x=this.s;x^=x<<13;x^=x>>>17;x^=x<<5;this.s=x>>>0;return this.s/4294967296}i(n){return Math.floor(this.n()*n)}}let running=false,start=0,last=0,player=1,passed=0,hits=0,seed=12345,diff=0,family=0,gates=[],nextGate=0,shake=0;const timeEl=document.getElementById('time'),passedEl=document.getElementById('passed'),hitsEl=document.getElementById('hits'),famEl=document.getElementById('family'),msg=document.getElementById('msg'),overlay=document.getElementById('overlay');function familyPlan(s){family=((s>>>0)%50);famEl.textContent=String(family+1).padStart(2,'0')+'/50';const rng=new RNG((s^((family+1)*2654435761))>>>0);let safe=rng.i(3),arr=[];for(let k=0;k<40;k++){let move=rng.i(3)-1;move=Math.max(-1,Math.min(1,move));safe=Math.max(0,Math.min(2,safe+move));let mask=7^(1<<safe);if(rng.n()<.32){const extra=[0,1,2].filter(x=>x!==safe)[rng.i(2)];mask&=~(1<<extra)}arr.push({safe,mask,twist:(rng.n()-.5)*.9})}return arr}let plan=[];function startGame(){seed=Number(document.getElementById('seed').value)||1;diff=Number(document.getElementById('diff').value)||0;plan=familyPlan(seed);running=true;start=performance.now();last=start;player=1;passed=0;hits=0;gates=[];nextGate=0;shake=0;overlay.style.display='none';passedEl.textContent='0';hitsEl.textContent='0';requestAnimationFrame(loop)}function move(d){if(!running)return;player=Math.max(0,Math.min(2,player+d))}document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);document.getElementById('play').onclick=startGame;document.getElementById('restart').onclick=()=>{overlay.style.display='flex'};let sx=null;stage.addEventListener('pointerdown',e=>sx=e.clientX);stage.addEventListener('pointerup',e=>{if(sx==null)return;let dx=e.clientX-sx;if(Math.abs(dx)>28)move(dx>0?1:-1);sx=null});function spawn(now){if(nextGate>=plan.length)return;let gap=[760,650,560][diff];if(gates.length===0||now-gates[gates.length-1].born>gap){const p=plan[nextGate++];gates.push({born:now,z:0,mask:p.mask,safe:p.safe,twist:p.twist,checked:false})}}function laneX(l,z,tw){const center=W/2,spread=(55+(1-z)*W*.34),curve=Math.sin((1-z)*2.2+tw)*18*(1-z);return center+(l-1)*spread+curve}function tunnel(){ctx.fillStyle='#02070d';ctx.fillRect(0,0,W,H);const cx=W/2,cy=H*.41;for(let r=0;r<14;r++){let t=r/13,ww=36+t*W*.9,hh=24+t*H*.85;ctx.strokeStyle=`rgba(40,228,255,${.10+t*.08})`;ctx.lineWidth=1.4;ctx.strokeRect(cx-ww/2,cy-hh*.12,ww,hh)}ctx.strokeStyle='rgba(64,210,255,.16)';for(let l=0;l<4;l++){ctx.beginPath();for(let y=0;y<H;y+=10){let z=1-y/H,x=cx+(l-1.5)*(40+(1-z)*W*.3);if(y===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()}}function drawGate(g,now){let speed=[.00042,.00049,.00057][diff];g.z=Math.min(1,(now-g.born)*speed);let p=g.z,yy=H*.19+p*H*.66,scale=.28+p*.95,gateW=W*.22*scale,gateH=H*.13*scale;for(let l=0;l<3;l++){let x=laneX(l,1-p,g.twist);let blocked=(g.mask&(1<<l))!==0;ctx.save();ctx.translate(x,yy);ctx.fillStyle=blocked?'#651625':'#0d4d46';ctx.strokeStyle=blocked?'#ff4d68':'#42f0c3';ctx.lineWidth=2;ctx.shadowBlur=blocked?18:12;ctx.shadowColor=ctx.strokeStyle;ctx.fillRect(-gateW/2,-gateH/2,gateW,gateH);ctx.strokeRect(-gateW/2,-gateH/2,gateW,gateH);ctx.shadowBlur=0;ctx.fillStyle=blocked?'#ff90a0':'#80ffd9';ctx.font=`900 ${Math.max(10,12*scale)}px system-ui`;ctx.textAlign='center';ctx.fillText(blocked?'✕':'OPEN',0,4);ctx.restore()}if(!g.checked&&p>.90){g.checked=true;if((g.mask&(1<<player))!==0){hits++;hitsEl.textContent=hits;shake=12;flash('اصطدام!','bad')}else{passed++;passedEl.textContent=passed;flash('نجاح','good')}}}let mt=0;function flash(t,c){msg.textContent=t;msg.className='msg show '+c;clearTimeout(mt);mt=setTimeout(()=>msg.className='msg',360)}function ship(){let x=laneX(player,0,0),y=H*.87;ctx.save();ctx.translate(x,y);ctx.shadowBlur=22;ctx.shadowColor='#2de7ff';ctx.fillStyle='#c9fbff';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(13,15);ctx.lineTo(0,9);ctx.lineTo(-13,15);ctx.closePath();ctx.fill();ctx.fillStyle='#1edcec';ctx.fillRect(-3,8,6,18);ctx.restore()}function loop(now){if(!running)return;let elapsed=(now-start)/1000,left=Math.max(0,20-elapsed);timeEl.textContent=left.toFixed(1);spawn(now);ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82}tunnel();gates=gates.filter(g=>g.z<1);for(const g of gates)drawGate(g,now);ship();ctx.restore();if(left<=0){running=false;finish();return}last=now;requestAnimationFrame(loop)}function finish(){const score=Math.max(0,passed*100-hits*35);overlay.style.display='flex';overlay.innerHTML=`<div class="card"><div class="title">انتهت الجولة</div><div class="result">${score}</div><div class="sub">بوابات ناجحة: <b>${passed}</b><br>اصطدامات: <b>${hits}</b><br>Family: <b>${family+1}/50</b></div><button class="play" id="again">جولة جديدة</button></div>`;document.getElementById('again').onclick=()=>location.reload()} })();</script></body></html>
