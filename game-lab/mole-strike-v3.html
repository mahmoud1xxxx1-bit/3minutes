<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>3 Minutes • Mole Strike V3</title><style>:root{--bg:#050A18;--deep:#020612;--surface:#0B1530;--raised:#102044;--strong:#1A3158;--accent:#19DCE8;--bright:#52F2F2;--violet:#7957F5;--pink:#D454E8;--ok:#4DDA9A;--danger:#FF667E;--gold:#FFCD68;--muted:#8293B2;--text:#F5F7FF;--soft:#C4CEE0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}body{margin:0;min-height:100svh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 15% 12%,#19dce81a,transparent 25%),radial-gradient(circle at 85% 18%,#7957f526,transparent 26%),linear-gradient(#08132B,var(--bg),var(--deep))}.app{width:min(100%,520px);margin:auto;padding:12px;display:flex;min-height:100svh;flex-direction:column;gap:10px}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:9px;align-items:center}.logo{width:38px;height:38px;border-radius:15px;display:grid;place-items:center;font-weight:1000;color:#041019;background:linear-gradient(135deg,var(--accent),var(--violet),var(--pink));box-shadow:0 0 24px #19dce844}.brand b{font-size:14px}.brand small{display:block;color:var(--muted);font-size:10px}.lab{font-size:10px;color:var(--ok);border:1px solid #4dda9a44;padding:6px 9px;border-radius:999px}.panel{background:#0B1530eb;border:1px solid var(--strong);border-radius:24px;box-shadow:0 8px 22px #0005}.hud{padding:10px 12px}.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.metric small{display:block;color:var(--muted);font-size:9px}.metric strong{font-size:18px}.left{text-align:left}.center{text-align:center}.center b{font-size:14px}.center small{display:block;color:var(--bright);font-size:9px}.bar{height:4px;border-radius:99px;background:var(--raised);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--violet),var(--pink));transition:.18s}.controls{padding:8px;display:flex;gap:7px;overflow:auto}.chip,.btn{border:1px solid var(--strong);background:var(--surface);color:var(--muted);border-radius:15px;padding:8px 10px;font-weight:900;white-space:nowrap}.chip.on{background:var(--accent);color:#041019;border-color:var(--accent)}.btn{margin-inline-start:auto;color:var(--soft)}.stage{position:relative;flex:1;min-height:560px;padding:10px;overflow:hidden}.intro{text-align:center}.intro h1{margin:3px 0;font-size:24px}.intro p{margin:0;color:var(--muted);font-size:11px}.badge{display:inline-block;margin-top:7px;border:1px solid #52f2f233;color:var(--bright);background:#19dce812;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900}.combo{position:absolute;top:78px;left:14px;font-size:11px;font-weight:1000;color:var(--gold);opacity:.35}.combo.hot{opacity:1;text-shadow:0 0 14px #ffcd6866}.grid{height:425px;margin:4px auto 0;max-width:430px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px}.slot{position:relative}.pit{position:absolute;width:82%;height:24%;left:9%;bottom:9%;border-radius:50%;background:radial-gradient(ellipse,#020612 0 49%,#102044 52% 67%,transparent 70%);filter:drop-shadow(0 8px 8px #0008)}.slot.warn .pit{animation:warn .14s ease 2}@keyframes warn{50%{transform:scaleX(1.08);filter:drop-shadow(0 0 8px #19dce855)}}.mole{position:absolute;z-index:2;left:8%;bottom:13%;width:84%;aspect-ratio:1/1.12;opacity:0;transform:translateY(74%) scale(.92);transition:transform .18s cubic-bezier(.2,.9,.2,1),opacity .11s;filter:drop-shadow(0 11px 12px #0007)}.mole.up{opacity:1;transform:translateY(0) scale(1)}.mole.hit{transform:translateY(-7%) scale(.82);opacity:.16}.mole.fake{filter:saturate(.72) hue-rotate(52deg) drop-shadow(0 11px 12px #0007)}.mole.fake:after{content:"✕";position:absolute;right:4px;top:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--danger);color:white;font-weight:1000;box-shadow:0 0 14px #ff667e66}.animal{width:100%;height:100%}.flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.flash b{font-size:52px;color:var(--ok);opacity:0;text-shadow:0 8px 25px #000}.flash.go b{animation:pop .42s}@keyframes pop{0%{opacity:0;transform:scale(.6)}35%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1.3)}}.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%) translateY(8px);opacity:0;background:var(--deep);border:1px solid var(--strong);border-radius:999px;padding:7px 12px;color:var(--soft);font-size:10px;font-weight:900;transition:.18s}.toast.show{opacity:1;transform:translateX(-50%)}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#020612dd;backdrop-filter:blur(8px);padding:20px}.overlay.hide{display:none}.box{text-align:center;max-width:340px}.box .kicker{font-size:10px;color:var(--bright);font-weight:1000}.box h2{font-size:31px;margin:8px 0 5px}.box p{color:var(--muted);font-size:12px;line-height:1.7}.start{border:0;border-radius:16px;padding:12px 22px;min-width:170px;font-weight:1000;color:#041019;background:linear-gradient(135deg,var(--accent),var(--violet),var(--pink))}.seed{margin-top:10px;color:var(--muted);font:700 9px ui-monospace,monospace}.variant{margin-top:4px;color:var(--bright);font-size:9px}@media(max-width:390px){.grid{height:395px}.mole{width:88%;left:6%}}</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">3</div><div><b>3 MINUTES</b><small>GAME LAB • MOLE STRIKE V3</small></div></div><span class="lab">● TEST BUILD</span></header><section class="panel hud"><div class="row"><div class="metric"><small>الإصابات</small><strong><span id="hits">0</span>/<span id="goal">7</span></strong></div><div class="center"><b>MOLE STRIKE</b><small id="diff">NORMAL</small></div><div class="metric left"><small>الوقت</small><strong id="time">0.0s</strong></div></div><div class="bar"><i id="progress"></i></div></section><section class="panel controls"><button class="chip on" data-d="normal">Normal</button><button class="chip" data-d="hard">Hard</button><button class="chip" data-d="expert">Expert</button><button class="btn" id="newSeed">نسخة جديدة ↻</button></section><section class="panel stage"><div class="intro"><h1>اضرب السنجاب</h1><p>هدف حقيقي واحد فقط. راقب الخدع واضرب بسرعة.</p><span class="badge">⚡ نفس Seed = نفس الجولة</span></div><div class="combo" id="combo">COMBO ×0</div><div id="grid" class="grid"></div><div id="flash" class="flash"><b>+1</b></div><div id="toast" class="toast"></div><div id="overlay" class="overlay"><div class="box"><div class="kicker">3 MINUTES • GAME LAB</div><h2 id="title">MOLE STRIKE V3</h2><p id="desc">هدف حقيقي واحد، خداع محسوب، وإيقاع يتصاعد مع الجولة.</p><button id="start" class="start">ابدأ التجربة</button><div class="seed">SEED <span id="seed"></span></div><div class="variant">VARIANT <span id="variant"></span></div></div></div></section></main><script>class RNG{constructor(s){this.s=s>>>0}next(){this.s=(Math.imul(1664525,this.s)+1013904223)>>>0;return this.s}int(n){return this.next()%n}float(){return this.next()/4294967296}}const BASE={normal:{goal:7,up:1180,gap:[300,590],fake:.03,limit:18,pen:.35},hard:{goal:9,up:940,gap:[210,470],fake:.17,limit:18,pen:.55},expert:{goal:11,up:760,gap:[130,340],fake:.29,limit:18,pen:.75}};const VARIANTS=[{id:'steady',gap:.98,up:1.06,fake:1},{id:'burst',gap:.78,up:1.04,fake:.9},{id:'zigzag',gap:.92,up:1.10,fake:1.05},{id:'decoy-wave',gap:1.02,up:1.08,fake:1.5},{id:'calm-then-rush',gap:.97,up:1.10,fake:1}];let difficulty='normal',seed=0,rng,variant,ended=true,hits=0,mistakes=0,penalty=0,startAt=0,raf=0,timeouts=[],activeReal=null,activeFake=null,last=-1,step=0,combo=0;const $=id=>document.getElementById(id),grid=$('grid');const squirrel=`<svg class="animal" viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAB173"/><stop offset=".55" stop-color="#B97746"/><stop offset="1" stop-color="#7D4A2D"/></linearGradient><linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFE6C6"/><stop offset="1" stop-color="#E5B17D"/></linearGradient><linearGradient id="nut" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C88A4C"/><stop offset="1" stop-color="#744326"/></linearGradient></defs><path d="M104 48c29-31 44-8 26 12 22 0 20 31-8 30 14 20-8 36-25 18" fill="none" stroke="#9B6038" stroke-width="15" stroke-linecap="round"/><ellipse cx="43" cy="31" rx="18" ry="22" fill="url(#fur)" transform="rotate(-24 43 31)"/><ellipse cx="88" cy="31" rx="18" ry="22" fill="url(#fur)" transform="rotate(24 88 31)"/><path d="M34 23c6-9 14-10 20-2" fill="#F7B9A1"/><path d="M77 21c6-8 15-7 20 2" fill="#F7B9A1"/><ellipse cx="66" cy="78" rx="43" ry="47" fill="url(#fur)"/><ellipse cx="66" cy="92" rx="29" ry="27" fill="url(#cream)"/><ellipse cx="49" cy="69" rx="6" ry="7" fill="#131722"/><ellipse cx="83" cy="69" rx="6" ry="7" fill="#131722"/><circle cx="47" cy="67" r="1.5" fill="#fff"/><circle cx="81" cy="67" r="1.5" fill="#fff"/><ellipse cx="66" cy="80" rx="8.5" ry="7" fill="#5A3224"/><path d="M56 89c5 6 15 6 20 0" fill="none" stroke="#724431" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="40" cy="84" rx="6.5" ry="4" fill="#EFA491" opacity=".8"/><ellipse cx="92" cy="84" rx="6.5" ry="4" fill="#EFA491" opacity=".8"/><path d="M42 104c7 8 11 11 18 12" fill="none" stroke="#8A5434" stroke-width="6" stroke-linecap="round"/><path d="M91 104c-7 8-11 11-18 12" fill="none" stroke="#8A5434" stroke-width="6" stroke-linecap="round"/><ellipse cx="66" cy="118" rx="13" ry="17" fill="url(#nut)" transform="rotate(-8 66 118)"/><path d="M55 109c7-6 17-6 23 1" fill="#5B3522"/><path d="M57 112c6-4 14-4 20 0" stroke="#E4B16A" stroke-width="2" fill="none"/><path d="M29 111c-10 7-13 16-11 25 10-6 19-6 26 0" fill="none" stroke="#8A5434" stroke-width="5" stroke-linecap="round"/><path d="M103 111c10 7 13 16 11 25-10-6-19-6-26 0" fill="none" stroke="#8A5434" stroke-width="5" stroke-linecap="round"/></svg>`;for(let i=0;i<9;i++){const s=document.createElement('div');s.className='slot';s.dataset.i=i;s.innerHTML=`<div class="mole" data-i="${i}">${squirrel}</div><div class="pit"></div>`;grid.appendChild(s);s.querySelector('.mole').onpointerdown=hit}function randomSeed(){return crypto.getRandomValues(new Uint32Array(1))[0]>>>0}function cfg(){const b=BASE[difficulty],v=variant;return{goal:b.goal,up:Math.round(b.up*v.up),min:Math.round(b.gap[0]*v.gap),max:Math.round(b.gap[1]*v.gap),fake:Math.min(.42,b.fake*v.fake),limit:b.limit,pen:b.pen}}function clearTimers(){cancelAnimationFrame(raf);timeouts.forEach(clearTimeout);timeouts=[];activeReal=activeFake=null}function setup(newSeed=true){clearTimers();if(newSeed)seed=randomSeed();rng=new RNG(seed);variant=VARIANTS[rng.int(VARIANTS.length)];ended=true;hits=mistakes=penalty=step=combo=0;last=-1;$('hits').textContent=0;$('goal').textContent=cfg().goal;$('time').textContent='0.0s';$('progress').style.width='0%';$('seed').textContent=seed;$('variant').textContent=variant.id;$('diff').textContent=difficulty.toUpperCase();$('combo').textContent='COMBO ×0';$('combo').classList.remove('hot');document.querySelectorAll('.mole').forEach(x=>x.className='mole');document.querySelectorAll('.slot').forEach(x=>x.classList.remove('warn'))}function begin(){setup(false);ended=false;$('overlay').classList.add('hide');startAt=performance.now();schedule();tick()}function elapsed(){return(performance.now()-startAt)/1000+penalty}function tick(){if(ended)return;const e=elapsed();$('time').textContent=e.toFixed(1)+'s';if(e>=cfg().limit)return finish(false);raf=requestAnimationFrame(tick)}function pickHole(exclude=[]){for(let k=0;k<18;k++){const i=rng.int(9);if(i!==last&&!exclude.includes(i)){last=i;return i}}return rng.int(9)}function nextDelay(){const c=cfg();let min=c.min,max=c.max;if(variant.id==='calm-then-rush'&&step>4){min*=.70;max*=.73}if(variant.id==='burst'&&step%4===3){min*=.48;max*=.56}return Math.round(min+rng.int(Math.max(1,Math.round(max-min)+1)))}function schedule(){if(ended)return;timeouts.push(setTimeout(()=>{spawnRound();schedule()},nextDelay()))}function warn(i,cb){const slot=document.querySelector(`.slot[data-i="${i}"]`);slot.classList.add('warn');timeouts.push(setTimeout(()=>{slot.classList.remove('warn');cb()},140))}function spawnRound(){if(activeReal!==null)return;const c=cfg(),real=pickHole(activeFake!==null?[activeFake]:[]);warn(real,()=>showReal(real,c.up));if(difficulty!=='normal'&&rng.float()<c.fake&&activeFake===null){const fake=pickHole([real]);timeouts.push(setTimeout(()=>warn(fake,()=>showFake(fake,Math.round(c.up*.92))),120+rng.int(150)))}step++}function showReal(i,ms){if(ended||activeReal!==null)return;activeReal=i;const el=document.querySelector(`.mole[data-i="${i}"]`);el.className='mole';requestAnimationFrame(()=>el.classList.add('up'));timeouts.push(setTimeout(()=>{if(activeReal===i){activeReal=null;el.classList.remove('up');combo=0;updateCombo();toast('فاتك الهدف')}},ms))}function showFake(i,ms){if(ended||activeFake!==null)return;activeFake=i;const el=document.querySelector(`.mole[data-i="${i}"]`);el.className='mole fake';requestAnimationFrame(()=>el.classList.add('up'));timeouts.push(setTimeout(()=>{if(activeFake===i){activeFake=null;el.classList.remove('up')}},ms))}function hit(e){if(ended)return;const el=e.currentTarget,i=+el.dataset.i;if(i===activeFake){mistakes++;combo=0;updateCombo();penalty+=cfg().pen;activeFake=null;el.classList.add('hit');toast(`مخادع! +${cfg().pen.toFixed(2)}s`);return timeouts.push(setTimeout(()=>el.classList.remove('up'),90))}if(i!==activeReal)return;activeReal=null;hits++;combo++;updateCombo();$('hits').textContent=hits;$('progress').style.width=(hits/cfg().goal*100)+'%';el.classList.add('hit');$('flash').classList.remove('go');void $('flash').offsetWidth;$('flash').classList.add('go');timeouts.push(setTimeout(()=>el.classList.remove('up'),90));if(hits>=cfg().goal)finish(true)}function updateCombo(){$('combo').textContent=`COMBO ×${combo}`;$('combo').classList.toggle('hot',combo>=3)}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.x);toast.x=setTimeout(()=>$('toast').classList.remove('show'),700)}function finish(ok){if(ended)return;ended=true;clearTimers();const e=elapsed();$('overlay').classList.remove('hide');$('title').textContent=ok?'CLEAR!':'انتهى الوقت';$('desc').innerHTML=ok?`أنهيت الجولة في <b>${e.toFixed(2)} ثانية</b><br>الأخطاء: ${mistakes} • أفضل تسلسل: ×${combo}`:`أصبت ${hits} من ${cfg().goal}. جرّب Seed أخرى.`;$('start').textContent='إعادة نفس النسخة'}$('start').onclick=()=>{rng=new RNG(seed);begin()};$('newSeed').onclick=()=>{setup(true);$('title').textContent='MOLE STRIKE V3';$('desc').textContent='تم توليد Seed جديد بنمط مختلف محتمل.';$('start').textContent='ابدأ النسخة الجديدة';$('overlay').classList.remove('hide')};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{difficulty=b.dataset.d;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));setup(true);$('title').textContent='MOLE STRIKE V3';$('desc').textContent='تم تغيير الصعوبة وتوليد Seed جديد.';$('start').textContent='ابدأ التجربة';$('overlay').classList.remove('hide')});setup(true);</script></body></html>
