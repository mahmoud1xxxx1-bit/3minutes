<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>3 Minutes • Mole Strike</title><style>
:root{--bg:#050A18;--deep:#020612;--surface:#0B1530;--raised:#102044;--strong:#1A3158;--accent:#19DCE8;--bright:#52F2F2;--violet:#7957F5;--pink:#D454E8;--success:#4DDA9A;--danger:#FF667E;--warning:#FFB85A;--gold:#FFCD68;--muted:#8293B2;--text:#F5F7FF;--soft:#C4CEE0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}body{margin:0;min-height:100svh;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(#08132B,var(--bg),var(--deep));overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 14% 12%,rgba(25,220,232,.16),transparent 22%),radial-gradient(circle at 85% 16%,rgba(121,87,245,.15),transparent 25%),radial-gradient(circle at 55% 88%,rgba(212,84,232,.07),transparent 29%)}.app{width:min(100%,520px);margin:auto;min-height:100svh;padding:12px;display:flex;flex-direction:column;gap:10px}.brand{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}.brand-left{display:flex;align-items:center;gap:9px}.logo{width:38px;height:38px;border-radius:16px;display:grid;place-items:center;font-weight:1000;color:#031018;background:linear-gradient(135deg,#16D9E6,#6D5AF4,#C84FE0);box-shadow:0 0 22px rgba(25,220,232,.3)}.brand b{font-size:14px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.lab{padding:6px 9px;border-radius:999px;border:1px solid rgba(77,218,154,.25);color:var(--success);font-size:10px;font-weight:900;background:rgba(77,218,154,.05)}.panel{border:1px solid var(--strong);background:rgba(11,21,48,.92);border-radius:24px;box-shadow:0 7px 18px rgba(0,207,224,.08)}.hud{padding:10px 12px}.hudrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.metric small{display:block;color:var(--muted);font-size:9px}.metric strong{font-size:18px}.metric.left{text-align:left}.title{text-align:center}.title b{font-size:14px}.title small{display:block;color:var(--bri ckground:linear-gradient(145deg,#BD7C4D,#7F4E34);border:2px solid rgba(245,247,255,.08)}.snout{position:absolute;left:17%;right:17%;bottom:13%;height:48%;border-radius:50%;background:#DCA777}.eye{position:absolute;top:28%;width:7px;height:8px;border-radius:50%;background:#0A0D12}.el{left:28%}.er{right:28%}.nose{position:absolute;top:49%;left:50%;width:9px;height:7px;transform:translateX(-50%);border-radius:50%;background:#271A13}.stripe{position:absolute;left:42%;top:10%;width:16%;height:35%;border-radius:50%;background:rgba(47,29,22,.35)}.mole.fake .head{background:linear-gradient(145deg,#784B83,#422C50)}.mole.fake .snout{background:#B086B9}.mole.fake:after{content:"✕";position:absolute;z-index:4;left:50%;top:39%;transform:translate(-50%,-50%);font-size:20px;font-weight:1000;color:var(--danger);text-shadow:0 3px 10px #000}.pop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9}.pop b{font-size:44px;opacity:0;color:var(--success);text-shadow:0 6px 25px #000}.pop.go b{animation:p .4s}@keyframes p{0%{opacity:0;transform:scale(.6)}35%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}.toast{position:absolute;z-index:10;bottom:11px;left:50%;transform:translateX(-50%) translateY(8px);opacity:0;padding:7px 11px;border-radius:999px;border:1px solid var(--strong);background:var(--deep);color:var(--soft);font-size:10px;font-weight:900;transition:.18s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.overlay{position:absolute;z-index:20;inset:0;display:grid;place-items:center;padding:22px;background:rgba(2,6,18,.82);backdrop-filter:blur(8px)}.overlay.hide{display:none}.box{text-align:center;max-width:330px}.kicker{color:var(--bright);font-size:10px;font-weight:1000;letter-spacing:1px}.box h2{font-size:32px;margin:9px 0 5px}.box p{font-size:12px;line-height:1.7;color:var(--muted)}.start{border:0;border-radius:16px;padding:12px 22px;min-width:165px;font-size:13px;font-weight:1000;color:#031018;background:linea </style></head><body><main class="app"><header class="brand"><div class="brand-left"><div class="logo">3</div><div><b>3 MINUTES</b><small>GAME LAB • MOLE STRIKE</small></div></div><span class="lab">● TEST BUILD</span></header><section class="panel hud"><div class="hudrow"><div class="metric"><small>الإصابات</small><strong><span id="h">0</span>/<span id="g">7</span></strong></div><div class="title"><b>MOLE STRIKE</b><small id="dl">NORMAL</small></div><div class="metric left"><small>الوقت</small><strong id="t">0.0s</strong></div></div><div class="progress"><i id="bar"></i></div></section><section class="panel controls"><button class="chip on" data-d="normal">Normal</button><button class="chip" data-d="hard">Hard</button><button class="chip" data-d="expert">Expert</button><button class="new" id="new">نسخة جديدة ↻</button></section><section class="panel stage"><div class="intro"><h1>اضرب السنجاب</h1><p>اضرب الهدف الحقيقي قبل اختفائه وتجنب المخادع.</p><span class="goal">⚡ أكمل الهدف بأسرع وقت</span></div><div class="grid" id="grid"></div><div class="pop" id="pop"><b>+1</b></div><div class="toast" id="toast"></div><div class="overlay" id="ov"><div class="box"><div class="kicker">3 MINUTES • GAME LAB</div><h2 id="oh">MOLE STRIKE</h2><p id="op">نسخة مستقلة للاختبار قبل إدخال اللعبة إلى التطبيق. نفس Seed يعيد نفس التسلسل.</p><button class="start" id="start">ابدأ التجربة</button><div class="seed">SEED <span id="seed"></span></div></div></div></section></main><script>
class R{constructor(s){this.s=s>>>0}n(){this.s=(Math.imul(1664525,this.s)+1013904223)>>>0;return this.s}i(m){return this.n()%m}f(){return this.n()/4294967296}}
const C={normal:{goal:7,up:760,min:220,max:520,fake:.05,two:0,limit:18},hard:{goal:9,up:610,min:150,max:390,fake:.18,two:.12,limit:18},expert:{goal:11,up:480,min:90,max:280,fake:.30,two:.22,limit:18}};let d='normal',seed=0,r,ended=true,hits=0,errors=0,startAt=0,raf=0,to=[],active=new Map(),step=0;const $=id=>document.getElementById(id),grid=$('grid');for(let i=0;i<9;i++){let s=document.createElement('div');s.className='slot';s.innerHTML=`<div class="mole" data-i="${i}"><i class="ear e1"></i><i class="ear e2"></i><i class="head"><i class="stripe"></i><i class="snout"><i class="eye el"></i><i class="eye er"></i><i class="nose"></i></i></i></div><div class="pit"></div>`;grid.appendChild(s);s.querySelector('.mole').onpointerdown=hit}
function rs(){return crypto.getRandomValues(new Uint32Array(1))[0]>>>0}function clear(){cancelAnimationFrame(raf);to.forEach(clearTimeout);to=[];active.clear()}function reset(ns=true){clear();if(ns)seed=rs();r=new R(seed);ended=true;hits=errors=step=0;$('h').textContent=0;$('g').textContent=C[d].goal;$('t').textContent='0.0s';$('bar').style.width='0%';$('seed').textContent=seed;$('dl').textContent=d.toUpperCase();document.querySelectorAll('.mole').forEach(x=>x.className='mole')}function begin(){reset(false);ended=false;$('ov').classList.add('hide');startAt=performance.now();next();tick()}function tick(){if(ended)return;let e=(performance.now()-startAt)/1000;$('t').textContent=e.toFixed(1)+'s';if(e>=C[d].limit)return finish(false);raf=requestAnimationFrame(tick)}function next(){if(ended)return;let c=C[d],delay=c.min+r.i(c.max-c.min+1);to.push(setTimeout(()=>{spawn();next()},delay))}function free(){for(let k=0;k<20;k++){let i=r.i(9);if(!active.has(i))return i}return r.i(9)}function spawn(){let c=C[d],i=free(),fake=r.f()<c.fake;show(i,fake,c.up);if(r.f()<c.two){let j=free();to.push(setTimeout(()=>show(j,r.f()<c.fake,c.up*.9),70+r.i(110)))}step++}function show(i,fake,ms){let el=document.querySelector(`.mole[data-i="${i}"]`);if(ended)return;active.set(i,{fake});el.classList.toggle('fake',fake);el.classList.remove('hit');requestAnimationFrame(()=>el.classList.add('up'));to.push(setTimeout(()=>{if(active.has(i)){active.delete(i);el.classList.remove('up');if(!fake)toast('فاتك الهدف')}},ms))}function hit(e){if(ended)return;let el=e.currentTarget,i=+el.dataset.i,a=active.get(i);if(!a)return;if(a.fake){errors++;active.delete(i);el.classList.add('hit');startAt-=600;toast('هدف مخادع • عقوبة 0.6s');return setTimeout(()=>el.classList.remove('up'),90)}active.delete(i);hits++;$('h').textContent=hits;$('bar').style.width=(hits/C[d].goal*100)+'%';el.classList.add('hit');$('pop').classList.remove('go');void $('pop').offsetWidth;$('pop').classList.add('go');setTimeout(()=>el.classList.remove('up'),90);if(hits>=C[d].goal)finish(true)}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.x);toast.x=setTimeout(()=>$('toast').classList.remove('show'),700)}function finish(ok){if(ended)return;ended=true;clear();let e=(performance.now()-startAt)/1000;$('ov').classList.remove('hide');$('oh').textContent=ok?'CLEAR!':'انتهى الوقت';$('op').innerHTML=ok?`أنهيت الجولة في <b>${e.toFixed(2)} ثانية</b><br>الأخطاء: ${errors}`:`أصبت ${hits} من ${C[d].goal}. جرّب نسخة أخرى.`;$('start').textContent='إعادة نفس النسخة'}$('start').onclick=()=>{r=new R(seed);begin()};$('new').onclick=()=>{reset(true);$('oh').textContent='MOLE STRIKE';$('op').textContent='تم توليد Seed جديد. اختبر عدة نسخ قبل الحكم على المستوى.';$('start').textContent='ابدأ النسخة الجديدة';$('ov').classList.remove('hide')};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{d=b.dataset.d;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));reset(true);$('oh').textContent='MOLE STRIKE';$('op').textContent=`المستوى ${d.toUpperCase()} — نفس القاعدة لكن سرعة وخدع وضغط أعلى.`;$('start').textContent='ابدأ التجربة';$('ov').classList.remove('hide')});reset(true);
</script></body></html>
