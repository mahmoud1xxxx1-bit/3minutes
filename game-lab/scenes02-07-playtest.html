<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اكتشف الفروقات — Game Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#071522;color:#fff;font-family:system-ui}.app{padding:12px}h1{text-align:center;margin:4px}.sub{text-align:center;color:#a9bfd0}.lab{max-width:900px;margin:10px auto;padding:10px;border:1px dashed #47708d;border-radius:14px;text-align:center}.puzzles{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:8px}button{background:#0b1d2c;color:#fff;border:1px solid #456b86;border-radius:10px;padding:9px 14px;font-weight:800}button.active{outline:2px solid #6ee7ff}.hud{display:flex;justify-content:center;gap:12px;margin:10px}.pill{min-width:180px;text-align:center;border:1px solid #355877;border-radius:14px;padding:8px}.pill b{display:block;color:#ffd052;font-size:21px}.boards{max-width:1450px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:ltr}.board{position:relative;aspect-ratio:4/3;border:1px solid #47708d;border-radius:18px;overflow:hidden;background:#eee}.board svg{width:100%;height:100%;display:block}.tag{position:absolute;right:10px;top:10px;background:#071522dd;padding:5px 10px;border-radius:9px;font-weight:900}.mark{position:absolute;border:3px solid #55ffae;border-radius:50%;box-shadow:0 0 15px #55ffae;transform:translate(-50%,-50%);width:36px;height:36px;pointer-events:none}.toast{position:fixed;top:8%;left:50%;transform:translateX(-50%);background:#071522ee;border:1px solid #456b86;border-radius:20px;padding:8px 15px;opacity:0}.toast.show{opacity:1}@media(max-width:850px){.boards{grid-template-columns:1fr}}</style></head><body><div class="app"><h1 id="title">اكتشف الفروقات</h1><div class="sub">اضغط مباشرة على الاختلاف في أي صورة — لا يوجد مؤقت ولا تلميحات</div><div class="lab"><b id="sceneName"></b><div class="puzzles" id="puzzles"></div></div><div class="hud"><div class="pill"><b id="found">0/5</b><span>الفروقات المكتشفة</span></div><div class="pill"><b id="mist">0</b><span>الأخطاء</span></div></div><div class="boards"><div class="board" id="ba"><span class="tag">A</span><div id="a"></div></div><div class="board" id="bb"><span class="tag">B</span><div id="b"></div></div></div></div><div id="toast" class="toast"></div><script>(()=>{const q=new URLSearchParams(location.search),sn=Math.max(2,Math.min(7,+q.get('scene')||2));const themes={2:['Scene 02 — غرفة المعيشة','#f4dfc1','#2e7188','#c88955'],3:['Scene 03 — المطبخ','#f2e6cf','#79ad8b','#b9b8b1'],4:['Scene 04 — شرفة الحديقة','#bfe9f5','#4f9c62','#c98c53'],5:['Scene 05 — غرفة النوم','#f0dfc7','#7b6298','#9b663e'],6:['Scene 06 — حديقة المنزل','#b9e4f0','#5b9d4c','#8a613b'],7:['Scene 07 — غرفة الدراسة','#ead8bd','#9b673c','#6d4931']}[sn];document.getElementById('sceneName').textContent=themes[0];let pi=0,found=new Set(),mist=0;const spots=[[18,25],[38,23],[72,22],[84,42],[25,56],[50,55],[72,58],[15,76],[42,78],[68,78],[88,76],[52,38]];const colors=['#e95d4f','#3d84c6','#f0b83f','#56a46e','#9c5db2','#ef7e43','#39a7a0','#d94f75','#7f9f3c','#596ac0','#c98145','#55a9d1'];function base(side){const [_,wall,main,wood]=themes;let decor='';if(sn===2)decor='<rect x="120" y="300" width="560" height="190" rx="45" fill="'+main+'"/><rect x="180" y="475" width="450" height="25" fill="#245268"/><ellipse cx="400" cy="650" rx="250" ry="75" fill="'+wood+'"/><rect x="70" y="80" width="190" height="160" rx="10" fill="#fff" stroke="#b89470" stroke-width="10"/><circle cx="650" cy="130" r="55" fill="#fff6e8" stroke="#67564a" stroke-width="9"/>';else if(sn===3)decor='<rect x="40" y="400" width="720" height="190" fill="'+main+'"/><rect x="330" y="250" width="170" height="260" rx="10" fill="#777"/><rect x="560" y="130" width="180" height="360" rx="16" fill="#eee"/><rect x="70" y="80" width="220" height="190" fill="#c8ecf4" stroke="#fff" stroke-width="12"/>';else if(sn===4)decor='<rect y="520" width="800" height="230" fill="#e8c694"/><rect x="0" y="350" width="800" height="18" fill="#3c5a59"/><circle cx="110" cy="470" r="85" fill="'+main+'"/><circle cx="680" cy="420" r="100" fill="'+main+'"/><ellipse cx="400" cy="580" rx="160" ry="60" fill="'+wood+'"/><rect x="610" y="110" width="130" height="330" rx="55" fill="#315c78"/>';else if(sn===5)decor='<rect x="130" y="300" width="500" height="260" rx="35" fill="'+main+'"/><rect x="170" y="260" width="420" height="80" rx="40" fill="#71482e"/><rect x="630" y="120" width="120" height="350" fill="#7d4d2d"/><rect x="70" y="110" width="180" height="130" fill="#bce6f4" stroke="#fff" stroke-width="10"/><rect x="270" y="560" width="260" height="70" rx="10" fill="'+wood+'"/>';else if(sn===6)decor='<rect y="500" width="800" height="250" fill="#70a84e"/><rect x="0" y="300" width="800" height="200" fill="#7a5737"/><circle cx="90" cy="390" r="110" fill="'+main+'"/><circle cx="690" cy="380" r="120" fill="'+main+'"/><rect x="250" y="470" width="360" height="90" rx="15" fill="'+wood+'"/><rect x="650" y="190" width="100" height="260" rx="50" fill="#426f3f"/>';else decor='<rect x="70" y="90" width="180" height="500" fill="#70472d"/><rect x="280" y="390" width="430" height="100" fill="'+main+'"/><rect x="590" y="80" width="150" height="190" fill="#bce7f5" stroke="#fff" stroke-width="10"/><circle cx="480" cy="160" r="48" fill="#fff8e8" stroke="#59483d" stroke-width="8"/><rect x="330" y="300" width="160" height="90" rx="8" fill="#303840"/>';let changes='';if(side==='B'){const ids=recipes[pi];ids.forEach((idx,j)=>{const [x,y]=spots[idx];changes+=`<circle data-hit="${idx}" cx="${x*8}" cy="${y*7.5}" r="28" fill="${colors[(idx+pi+j)%colors.length]}"/>`})}return `<svg viewBox="0 0 800 750" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="750" fill="${wall}"/>${decor}${changes}</svg>`}const recipes=Array.from({length:12},(_,i)=>[(i)%12,(i+2)%12,(i+5)%12,(i+7)%12,(i+9)%12]);const pa=document.getElementById('a'),pb=document.getElementById('b'),puzzles=document.getElementById('puzzles'),fe=document.getElementById('found'),me=document.getElementById('mist'),toast=document.getElementById('toast');function prep(){found.clear();mist=0;fe.textContent='0/5';me.textContent='0';document.querySelectorAll('.mark').forEach(e=>e.remove());pa.innerHTML=base('A');pb.innerHTML=base('B');[...puzzles.children].forEach((e,i)=>e.classList.toggle('active',i===pi))}function flash(t){toast.textContent=t;toast.className='toast show';clearTimeout(flash.t);flash.t=setTimeout(()=>toast.className='toast',300)}function tap(e,board){const r=board.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;let hit=-1,best=999;recipes[pi].forEach(idx=>{if(found.has(idx))return;const s=spots[idx],d=Math.hypot(x-s[0],y-s[1]);if(d<5&&d<best){best=d;hit=idx}});if(hit>=0){found.add(hit);for(const id of ['ba','bb']){const m=document.createElement('i');m.className='mark';m.style.left=spots[hit][0]+'%';m.style.top=spots[hit][1]+'%';document.getElementById(id).appendChild(m)}fe.textContent=found.size+'/5';flash(found.size===5?'اكتملت الفروقات':'فرق صحيح')}else{mist++;me.textContent=mist}}for(let i=0;i<12;i++){const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{pi=i;prep()};puzzles.appendChild(b)}document.getElementById('ba').addEventListener('pointerdown',e=>tap(e,e.currentTarget));document.getElementById('bb').addEventListener('pointerdown',e=>tap(e,e.currentTarget));prep()})();</script></body></html>
