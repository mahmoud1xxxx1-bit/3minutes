<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>اكتشف الفروقات — Game Lab</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#050b13;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body{background:radial-gradient(circle at 50% 0,#17314a,#071320 55%,#03070d)}
.app{min-height:100dvh;padding:12px}.title{text-align:center;margin:2px 0 1px;font-size:25px}.sub{text-align:center;color:#a9bfd0;font-size:12px;margin-bottom:9px}
.lab{max-width:900px;margin:0 auto 10px;padding:10px 12px;border:1px dashed #416985;border-radius:15px;background:#081522d9}.labHead{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.lab strong{color:#7fe8ff;font-size:12px}.lab button,.lab select{background:#0b1d2c;color:#fff;border:1px solid #456b86;border-radius:10px;padding:8px 11px;font-weight:850;cursor:pointer}.lab button:hover{background:#123047}.lab button.active{outline:2px solid #72e9ff;background:#123249}.puzzles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}.puzzles button{min-width:39px}
.hud{display:flex;justify-content:center;gap:10px;margin-bottom:10px}.pill{min-width:165px;text-align:center;padding:8px 14px;border:1px solid #355877;background:#091625e8;border-radius:14px;box-shadow:0 10px 26px #0003}.pill b{display:block;font-size:20px;color:#ffd052}.pill span{font-size:10px;color:#b3c6d8;font-weight:900}
.boards{max-width:1450px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:ltr}.board{position:relative;aspect-ratio:736/748;border:1px solid #46718f;border-radius:20px;overflow:hidden;background:#07101a;box-shadow:0 18px 50px #0008}.board canvas{width:100%;height:100%;display:block;touch-action:manipulation}.tag{position:absolute;top:10px;right:10px;z-index:4;background:#07101ddd;border:1px solid #7592a8;border-radius:10px;padding:4px 10px;font-weight:1000}.mark{position:absolute;z-index:5;border:3px solid #5affb4;border-radius:50%;box-shadow:0 0 18px #55ffae, inset 0 0 10px #55ffae55;transform:translate(-50%,-50%);pointer-events:none}.toast{position:fixed;left:50%;top:10%;transform:translateX(-50%);z-index:30;opacity:0;padding:8px 14px;border-radius:999px;background:#06101eee;border:1px solid #40617b;font-weight:1000;transition:.12s;pointer-events:none}.toast.show{opacity:1}.good{color:#65ffb5}.bad{color:#ff8293}
@media(max-width:850px){.boards{grid-template-columns:1fr;max-width:720px}.hud{flex-wrap:wrap}.pill{min-width:135px}.title{font-size:21px}}
</style></head><body>
<div class="app"><h1 class="title">اكتشف الفروقات</h1><div class="sub">اضغط مباشرة على الاختلاف في أي صورة — لا يوجد مؤقت</div>
<div class="lab"><div class="labHead"><strong>Game Lab فقط — اختر اللغز للتجربة</strong><select id="difficulty"><option value="3">Normal — 3 فروقات</option><option value="4">Hard — 4 فروقات</option><option value="5" selected>Expert — 5 فروقات</option></select><button id="prev" type="button">السابق</button><button id="next" type="button">التالي</button></div><div class="puzzles" id="puzzles"></div></div>
<div class="hud"><div class="pill"><b id="found">0/5</b><span>الفروقات المكتشفة</span></div><div class="pill"><b id="mist">0</b><span>الأخطاء</span></div></div>
<div class="boards"><div class="board" id="ba"><span class="tag">A</span><canvas id="a" width="736" height="748"></canvas></div><div class="board" id="bb"><span class="tag">B</span><canvas id="b" width="736" height="748"></canvas></div></div></div><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const W=736,H=748;
const BASE_SVG=`<svg xmlns="http://www.w3.org/2000/svg" width="736" height="748" viewBox="0 0 736 748"><defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7e7cf"/><stop offset="1" stop-color="#ead3b6"/></linearGradient><linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b98259"/><stop offset="1" stop-color="#8f6044"/></linearGradient><linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3b7890"/><stop offset="1" stop-color="#28586e"/></linearGradient><linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9854e"/><stop offset="1" stop-color="#8f512f"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3c2a22" flood-opacity=".22"/></filter><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#253746" flood-opacity=".18"/></filter></defs><rect width="736" height="520" fill="url(#wall)"/><rect y="520" width="736" height="228" fill="url(#floor)"/><path d="M0 514H736V530H0Z" fill="#694939" opacity=".8"/><g filter="url(#soft)"><rect x="55" y="63" width="190" height="176" rx="10" fill="#fffaf0" stroke="#b99672" stroke-width="8"/><rect x="69" y="77" width="162" height="148" rx="4" fill="#a8d9e8"/><path d="M150 77v148M69 151h162" stroke="#fff7e7" stroke-width="7"/><path d="M69 185c35-28 55-27 81-3 25-28 47-22 81 1v42H69Z" fill="#78b98c" opacity=".88"/><circle cx="196" cy="108" r="20" fill="#ffe18a"/></g><g filter="url(#soft)"><rect x="315" y="76" width="150" height="120" rx="8" fill="#9c6444"/><rect x="326" y="87" width="128" height="98" rx="4" fill="#f5efe3"/><circle cx="390" cy="128" r="25" fill="#eaa85f"/><path d="M337 171l35-32 23 20 23-28 25 40z" fill="#6aa284"/></g><g filter="url(#soft)"><circle cx="601" cy="112" r="49" fill="#69574b"/><circle cx="601" cy="112" r="42" fill="#fff8e9"/><circle cx="601" cy="112" r="4" fill="#4b4038"/><path d="M601 112l-1-25M601 112l22 10" stroke="#4b4038" stroke-width="5" stroke-linecap="round"/></g><g filter="url(#soft)"><rect x="285" y="226" width="170" height="13" rx="6" fill="#9a5f3c"/><rect x="303" y="189" width="22" height="37" rx="3" fill="#e06b59"/><rect x="327" y="181" width="20" height="45" rx="3" fill="#5d92ba"/><rect x="349" y="194" width="19" height="32" rx="3" fill="#e4b757"/><rect x="371" y="185" width="23" height="41" rx="3" fill="#6ba876"/><rect x="403" y="197" width="35" height="29" rx="4" fill="#d9d0c3"/><ellipse cx="420" cy="198" rx="17" ry="5" fill="#f3eee7"/></g><g filter="url(#soft)"><path d="M635 262h8v223h-8z" fill="#5b4b42"/><path d="M607 263h64l-12 74h-40z" fill="#e6b65f"/><ellipse cx="639" cy="486" rx="43" ry="9" fill="#5b4b42"/><circle cx="639" cy="278" r="10" fill="#fff1b8" opacity=".7"/></g><g filter="url(#soft)"><path d="M102 341c-32-52-30-84-7-111 18 34 14 72 7 111z" fill="#4d9363"/><path d="M105 341c15-62 40-87 68-93-4 40-29 71-68 93z" fill="#67a86e"/><path d="M101 341c-56-35-65-64-55-91 34 20 49 51 55 91z" fill="#75b778"/><path d="M107 343c29-42 54-51 77-44-18 31-43 43-77 44z" fill="#3f8258"/><path d="M104 333v72" stroke="#486c4d" stroke-width="8"/><path d="M67 391h77l-10 70H78z" fill="#c87855"/><ellipse cx="105" cy="391" rx="39" ry="10" fill="#e29b73"/></g><g filter="url(#shadow)"><rect x="151" y="310" width="438" height="151" rx="42" fill="url(#sofa)"/><rect x="130" y="353" width="47" height="119" rx="23" fill="#28566b"/><rect x="563" y="353" width="47" height="119" rx="23" fill="#28566b"/><rect x="173" y="378" width="394" height="96" rx="29" fill="#327087"/><path d="M188 459h360v17H188z" fill="#214c60" opacity=".8"/></g><g filter="url(#soft)"><path d="M197 330Q210 317 228 319L263 319Q280 332 278 352L278 389Q264 406 244 405L210 404Q195 390 196 370z" fill="#f1b45b"/><path d="M478 338Q491 325 510 330L547 337Q565 354 560 374L548 405Q530 420 511 413L475 402Q461 384 466 365z" fill="#d66c65"/></g><path d="M118 590Q368 545 618 590L584 707Q368 735 151 704z" fill="#e8cf9c" opacity=".95"/><path d="M178 621Q368 588 557 620" fill="none" stroke="#c3795b" stroke-width="12" stroke-linecap="round"/><path d="M190 665Q368 638 545 665" fill="none" stroke="#6b9aa4" stroke-width="10" stroke-linecap="round"/><g filter="url(#shadow)"><ellipse cx="365" cy="548" rx="243" ry="67" fill="url(#wood)"/><ellipse cx="365" cy="538" rx="243" ry="59" fill="#d89a62"/><path d="M200 565l-24 111M530 565l25 111" stroke="#70422f" stroke-width="17" stroke-linecap="round"/></g><g filter="url(#soft)"><path d="M140 516Q154 506 171 508L192 510Q208 523 206 542L206 558Q192 576 173 575L157 575Q142 561 143 543z" fill="#f7f2e6"/><path d="M198 526q25-4 24 17t-24 16" fill="none" stroke="#f7f2e6" stroke-width="10"/><ellipse cx="174" cy="516" rx="27" ry="7" fill="#d8c8b3"/><ellipse cx="174" cy="516" rx="19" ry="4" fill="#5f3a28"/></g><g filter="url(#soft)"><path d="M337 547L405 531 455 550 450 579 381 592 336 575Z" fill="#476fa0"/><path d="M345 552l61-14 38 14-61 13z" fill="#f2e8d5"/><path d="M381 565l69-13-2 20-67 13z" fill="#35577f"/></g><g><ellipse cx="505" cy="524" rx="36" ry="12" fill="#8b5c42"/><path d="M470 523q35 38 70 0" fill="#d09158"/><circle cx="498" cy="518" r="10" fill="#db6f5f"/><circle cx="516" cy="517" r="10" fill="#e7b34f"/></g></svg>`;
const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(BASE_SVG);
const a=document.getElementById('a'),b=document.getElementById('b'),A=a.getContext('2d'),B=b.getContext('2d'),ba=document.getElementById('ba'),bb=document.getElementById('bb');
const foundEl=document.getElementById('found'),mistEl=document.getElementById('mist'),toast=document.getElementById('toast'),difficulty=document.getElementById('difficulty'),puzzlesEl=document.getElementById('puzzles');let found=new Set(),mistakes=0,puzzleIndex=0,active=[];
function poly(pts){const p=new Path2D();p.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)p.lineTo(pts[i][0],pts[i][1]);p.closePath();return p}function circle(cx,cy,r){const p=new Path2D();p.arc(cx,cy,r,0,Math.PI*2);return p}function paint(color,alpha=.96){return(c,p)=>{c.save();c.globalAlpha=alpha;c.fillStyle=color;c.fill(p);c.restore()}}function key(id,group,path,color,mark){return{id,group,path,draw:paint(color),mark}}
const P={clock:()=>circle(601,112,42),left:()=>poly([[197,330],[211,319],[263,319],[278,334],[278,394],[264,405],[210,404],[196,390]]),right:()=>poly([[478,338],[493,327],[547,337],[563,355],[548,405],[531,418],[475,402],[464,382]]),mug:()=>poly([[140,516],[158,507],[192,510],[208,524],[206,558],[193,574],[157,575],[143,561]]),book:()=>poly([[337,547],[405,531],[455,550],[450,579],[381,592],[336,575]]),pot:()=>poly([[67,391],[144,391],[134,461],[78,461]]),lamp:()=>poly([[607,263],[671,263],[659,337],[619,337]]),art:()=>circle(390,128,25),books:()=>poly([[303,189],[325,189],[325,226],[303,226],[303,189],[327,181],[347,181],[347,226],[327,226],[327,181],[349,194],[368,194],[368,226],[349,226],[349,194],[371,185],[394,185],[394,226],[371,226]])};
const defs=[key('clockBlue','clock',P.clock,'#3f8fc3',[601,112]),key('clockTeal','clock',P.clock,'#4ca695',[601,112]),key('clockRose','clock',P.clock,'#bc6c86',[601,112]),key('leftBlue','left',P.left,'#4b86c6',[237,362]),key('leftGreen','left',P.left,'#6fa66d',[237,362]),key('leftPlum','left',P.left,'#9a659f',[237,362]),key('rightGold','right',P.right,'#e7b74c',[515,373]),key('rightMint','right',P.right,'#65ad8c',[515,373]),key('rightBlue','right',P.right,'#547eae',[515,373]),key('mugGreen','mug',P.mug,'#78a868',[174,542]),key('mugRed','mug',P.mug,'#c86561',[174,542]),key('mugBlue','mug',P.mug,'#5b88b5',[174,542]),key('bookRed','book',P.book,'#b8585f',[397,562]),key('bookGreen','book',P.book,'#4f8e70',[397,562]),key('bookGold','book',P.book,'#b88946',[397,562]),key('potBlue','pot',P.pot,'#5e8fa8',[105,426]),key('potGreen','pot',P.pot,'#6f9b6b',[105,426]),key('potGold','pot',P.pot,'#c49a58',[105,426]),key('lampBlue','lamp',P.lamp,'#5f91af',[639,300]),key('lampRose','lamp',P.lamp,'#c87a72',[639,300]),key('lampGreen','lamp',P.lamp,'#6d9a72',[639,300]),key('artBlue','art',P.art,'#648fb3',[390,128]),key('artRose','art',P.art,'#c56c7e',[390,128]),key('artGreen','art',P.art,'#75a36e',[390,128]),key('booksTeal','books',P.books,'#4d97a0',[349,207]),key('booksWine','books',P.books,'#9b5f77',[349,207]),key('booksGold','books',P.books,'#bd8f46',[349,207])];
const byId=Object.fromEntries(defs.map(d=>[d.id,d]));const recipes=[['clockBlue','leftBlue','rightGold','mugGreen','bookRed'],['potBlue','lampRose','artBlue','booksTeal','mugRed'],['clockTeal','leftGreen','rightMint','bookGreen','potGold'],['lampBlue','artRose','booksWine','rightBlue','mugBlue'],['clockRose','leftPlum','bookGold','potGreen','lampGreen'],['artGreen','booksGold','rightGold','mugRed','bookGreen'],['potBlue','leftBlue','lampRose','clockTeal','booksWine'],['rightMint','artBlue','mugGreen','bookRed','lampBlue'],['clockBlue','potGold','booksTeal','leftGreen','rightBlue'],['artRose','lampGreen','bookGold','mugBlue','leftPlum'],['booksGold','clockRose','potGreen','rightMint','mugRed'],['lampBlue','artGreen','leftBlue','bookGreen','clockTeal']];
function targetCount(){return Math.max(3,Math.min(5,+difficulty.value||5))}function prepare(){active=recipes[puzzleIndex].map(id=>byId[id]).slice(0,targetCount());found.clear();mistakes=0;document.querySelectorAll('.mark').forEach(x=>x.remove());foundEl.textContent='0/'+active.length;mistEl.textContent='0';[...puzzlesEl.children].forEach((el,i)=>el.classList.toggle('active',i===puzzleIndex));draw()}function draw(){if(!img.complete||!img.naturalWidth)return;A.clearRect(0,0,W,H);B.clearRect(0,0,W,H);A.drawImage(img,0,0,W,H);B.drawImage(img,0,0,W,H);for(const d of active){const p=d.path();d.draw(B,p)}}function point(e,canvas){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}function hit(pt,ctx){for(const d of active){if(found.has(d.id))continue;const p=d.path();if(ctx.isPointInPath(p,pt.x,pt.y))return d}return null}function mark(board,d){const m=document.createElement('div');m.className='mark';m.style.left=(d.mark[0]/W*100)+'%';m.style.top=(d.mark[1]/H*100)+'%';m.style.width='34px';m.style.height='34px';board.appendChild(m)}function flash(t,ok){toast.textContent=t;toast.className='toast show '+(ok?'good':'bad');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.className='toast',300)}function tap(e,canvas,ctx){const d=hit(point(e,canvas),ctx);if(d){found.add(d.id);mark(ba,d);mark(bb,d);foundEl.textContent=found.size+'/'+active.length;flash(found.size===active.length?'اكتملت الفروقات':'فرق صحيح',true)}else{mistakes++;mistEl.textContent=mistakes;flash('ليس اختلافًا',false)}}for(let i=0;i<recipes.length;i++){const btn=document.createElement('button');btn.type='button';btn.textContent=String(i+1);btn.onclick=()=>{puzzleIndex=i;prepare()};puzzlesEl.appendChild(btn)}document.getElementById('prev').onclick=()=>{puzzleIndex=(puzzleIndex+recipes.length-1)%recipes.length;prepare()};document.getElementById('next').onclick=()=>{puzzleIndex=(puzzleIndex+1)%recipes.length;prepare()};difficulty.onchange=prepare;a.addEventListener('pointerdown',e=>tap(e,a,A));b.addEventListener('pointerdown',e=>tap(e,b,B));img.onload=prepare;img.onerror=()=>flash('تعذر تجهيز المشهد',false);if(img.complete&&img.naturalWidth)prepare();
})();
</script></body></html>
