<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Find the Differences — Scene 01</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#050914;color:#fff;font-family:system-ui,Tahoma,sans-serif}.app{min-height:100vh;padding:10px;background:radial-gradient(circle at 50% -10%,#24355f,#071020 55%,#050914)}.hud{max-width:1280px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pill{background:#0d192ce8;border:1px solid #355077;border-radius:14px;padding:8px;text-align:center}.pill b{display:block;font-size:19px;color:#73ebff}.pill span{font-size:10px;color:#9aabc2}.title{text-align:center;font-size:24px;font-weight:1000;margin:10px 0 2px}.sub{text-align:center;color:#9fb0c7;font-size:12px;margin-bottom:10px}.boards{max-width:1280px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:ltr}.board{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;border:1px solid #3b557d;background:#101728}.board canvas{display:block;width:100%;height:100%;touch-action:manipulation}.tag{position:absolute;top:10px;right:10px;background:#07111fe8;border:1px solid #6681a8;border-radius:10px;padding:4px 10px;font-weight:1000}.mark{position:absolute;border:3px solid #54ffb1;border-radius:50%;box-shadow:0 0 18px #54ffb1;transform:translate(-50%,-50%);pointer-events:none}.toast{position:fixed;z-index:10;left:50%;top:9%;transform:translateX(-50%);opacity:0;background:#07101eef;border:1px solid #3e587e;border-radius:99px;padding:8px 15px;font-weight:900}.toast.show{opacity:1}.good{color:#62ffb2}.bad{color:#ff7187}.overlay{position:fixed;inset:0;z-index:20;background:#020611ef;display:flex;align-items:center;justify-content:center;padding:20px}.overlay.hidden{display:none}.card{width:min(430px,95vw);background:linear-gradient(#142542,#091426);border:1px solid #3a557d;border-radius:24px;padding:22px;text-align:center}.card h1{margin:0 0 8px}.card p{color:#a9bbd2;line-height:1.7}.row{display:flex;gap:8px;direction:ltr}.row input,.row select{min-width:0;flex:1;background:#06101f;color:#fff;border:1px solid #385370;border-radius:12px;padding:11px}.play{width:100%;height:52px;margin-top:10px;border:0;border-radius:15px;background:linear-gradient(90deg,#34d8ee,#94f6ff);font-weight:1000;color:#07111d}.result{font-size:38px;color:#72edff;font-weight:1000}@media(max-width:820px){.boards{grid-template-columns:1fr}.hud{max-width:680px}.title{font-size:20px}}</style></head>
<body><div class="app"><div class="hud"><div class="pill"><b id="time">20.0</b><span>الوقت</span></div><div class="pill"><b id="found">0/3</b><span>الفروقات</span></div><div class="pill"><b id="mistakes">0</b><span>الأخطاء</span></div></div><div class="title">اكتشف الفروقات — المشهد 01</div><div class="sub">منطقة الضغط مشتقة مباشرة من البكسلات المختلفة، وليست Hitbox مرسومة يدويًا</div><div class="boards"><div class="board" id="boardA"><div class="tag">A</div><canvas id="a" width="1000" height="750"></canvas></div><div class="board" id="boardB"><div class="tag">B</div><canvas id="b" width="1000" height="750"></canvas></div></div></div><div id="toast" class="toast"></div><div id="overlay" class="overlay"><div id="card" class="card"><h1>Scene 01 • Pixel Mask</h1><p>هذه النسخة تختبر الأساس الصحيح: كل فرق له Mask تُستخرج آليًا من البكسلات التي تغيرت فعلًا. الضغط خارجها = خطأ.</p><div class="row"><input id="seed" value="20260820"><select id="difficulty"><option value="3">Normal • 3</option><option value="4">Hard • 4</option><option value="5">Expert • 5</option></select></div><button id="play" class="play">ابدأ التجربة</button></div></div>
<script>(()=>{'use strict';const W=1000,H=750,a=document.getElementById('a'),b=document.getElementById('b'),A=a.getContext('2d'),B=b.getContext('2d'),ba=document.getElementById('boardA'),bb=document.getElementById('boardB'),overlay=document.getElementById('overlay'),card=document.getElementById('card'),toast=document.getElementById('toast'),te=document.getElementById('time'),fe=document.getElementById('found'),me=document.getElementById('mistakes');let active=[],found=new Set(),masks=new Map(),mistakes=0,remain=20,running=false,last=0,seed=1;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const D=['clock','lamp','cushion','mug','book','plant','picture','shelfbook','moon','vase'];function choose(n){const r=rng(seed),x=[...D];for(let i=x.length-1;i;i--){let j=(r()*(i+1))|0;[x[i],x[j]]=[x[j],x[i]]}return x.slice(0,n)}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function scene(c,mods){const on=id=>mods.has(id);let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#252536');g.addColorStop(1,'#17151f');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='#876a55';c.fillRect(0,610,W,140);c.strokeStyle='#a98a72';c.globalAlpha=.25;for(let x=0;x<W;x+=90){c.beginPath();c.moveTo(x,610);c.lineTo(x+35,750);c.stroke()}c.globalAlpha=1;
// window
c.fillStyle='#080e18';rr(c,70,65,300,230,18);let sky=c.createLinearGradient(0,75,0,280);sky.addColorStop(0,'#244d69');sky.addColorStop(1,'#b17772');c.fillStyle=sky;rr(c,84,79,272,202,10);c.fillStyle=on('moon')?'#ffb35f':'#ffe08b';c.beginPath();c.arc(128,120,on('moon')?20:31,0,7);c.fill();c.fillStyle='#183c34';c.beginPath();c.moveTo(84,250);c.quadraticCurveTo(160,170,230,240);c.quadraticCurveTo(300,180,356,235);c.lineTo(356,281);c.lineTo(84,281);c.fill();
// picture
c.fillStyle='#101723';rr(c,410,70,220,175,10);c.fillStyle='#17364b';rr(c,425,85,190,145,6);c.fillStyle='#d6a85f';if(on('picture')){c.fillRect(460,112,80,18)}else{c.beginPath();c.arc(500,125,31,0,7);c.fill()}c.fillStyle='#4d9575';c.beginPath();c.moveTo(435,220);c.lineTo(480,160);c.lineTo(525,210);c.lineTo(570,155);c.lineTo(605,220);c.fill();
// clock
c.fillStyle='#0c131c';c.beginPath();c.arc(760,140,62,0,7);c.fill();c.strokeStyle='#e9eee7';c.lineWidth=7;c.stroke();c.strokeStyle='#edf2ec';c.lineWidth=5;c.beginPath();c.moveTo(760,140);c.lineTo(760,99);c.moveTo(760,140);c.lineTo(on('clock')?800:787,on('clock')?165:112);c.stroke();
// shelf + books
c.fillStyle='#6a4835';rr(c,610,300,175,18,5);let cols=['#55b4c0','#e4bd5e','#7e8fd0'];if(on('shelfbook'))cols[1]='#e66f75';cols.forEach((q,i)=>{c.fillStyle=q;rr(c,635+i*38,235-i*4,25,64+i*4,3)});
// plant left
c.fillStyle=on('vase')?'#9c5963':'#9b6848';rr(c,80,485,95,105,18);c.strokeStyle='#4f8b61';c.lineWidth=7;for(let i=0;i<4;i++){c.beginPath();c.moveTo(127,486);c.quadraticCurveTo(80+i*30,420,90+i*35,365);c.stroke()}c.fillStyle=on('plant')?'#9bc66e':'#66b77b';for(let i=0;i<4;i++){c.beginPath();c.ellipse(90+i*35,370+i%2*15,19,38,-.5+i*.3,0,7);c.fill()}
// sofa
c.fillStyle='#6b6072';rr(c,250,430,400,160,30);c.fillStyle='#3b5963';rr(c,230,480,48,95,16);rr(c,620,480,48,95,16);c.fillStyle=on('cushion')?'#df9b63':'#d86e72';rr(c,310,455,90,78,17);c.fillStyle='#dfa15f';rr(c,420,460,90,72,17);c.fillStyle='#4f7691';rr(c,525,455,90,78,17);
// table
c.fillStyle='#a06b47';rr(c,430,585,330,30,12);c.fillStyle='#674633';c.fillRect(465,615,20,90);c.fillRect(710,615,20,90);
// mug
c.fillStyle=on('mug')?'#54b9d4':'#ece9dd';rr(c,490,520,65,58,9);c.strokeStyle=on('mug')?'#54b9d4':'#ece9dd';c.lineWidth=9;c.beginPath();c.arc(555,549,17,-1.5,1.5);c.stroke();
// book
c.fillStyle=on('book')?'#4f79c9':'#4c9b68';c.save();c.translate(640,550);c.rotate(-.08);rr(c,-48,-18,100,32,4);c.restore();
// lamp
c.strokeStyle='#d4dadd';c.lineWidth=8;c.beginPath();c.moveTo(870,330);c.lineTo(870,575);c.stroke();c.fillStyle=on('lamp')?'#f0aa54':'#62b7b0';c.beginPath();c.moveTo(820,270);c.lineTo(920,270);c.lineTo(900,340);c.lineTo(838,340);c.fill();c.fillStyle='#fff0a8';c.beginPath();c.arc(870,310,10,0,7);c.fill();c.fillStyle='#bdc3c9';c.beginPath();c.ellipse(870,578,55,14,0,0,7);c.fill()}
function buildMasks(){masks.clear();const c0=document.createElement('canvas'),c1=document.createElement('canvas');c0.width=c1.width=W;c0.height=c1.height=H;const x=c0.getContext('2d',{willReadFrequently:true}),y=c1.getContext('2d',{willReadFrequently:true});scene(x,new Set());const p=x.getImageData(0,0,W,H).data;for(const id of active){y.clearRect(0,0,W,H);scene(y,new Set([id]));const q=y.getImageData(0,0,W,H).data,raw=new Uint8Array(W*H);let x1=W,y1=H,x2=0,y2=0;for(let n=0,k=0;n<raw.length;n++,k+=4){if(Math.abs(p[k]-q[k])+Math.abs(p[k+1]-q[k+1])+Math.abs(p[k+2]-q[k+2])>30){raw[n]=1;let xx=n%W,yy=n/W|0;x1=Math.min(x1,xx);x2=Math.max(x2,xx);y1=Math.min(y1,yy);y2=Math.max(y2,yy)}}const m=new Uint8Array(raw.length),R=4;for(let yy=y1;yy<=y2;yy++)for(let xx=x1;xx<=x2;xx++)if(raw[yy*W+xx])for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++)if(dx*dx+dy*dy<=R*R){let X=xx+dx,Y=yy+dy;if(X>=0&&X<W&&Y>=0&&Y<H)m[Y*W+X]=1}masks.set(id,{m,b:[x1,y1,x2,y2]})}}
function render(){scene(A,new Set());scene(B,new Set(active));buildMasks()}function point(e,c){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}function hit(p){let x=Math.round(p.x),y=Math.round(p.y);for(const id of active)if(!found.has(id)){let z=masks.get(id);if(z&&z.m[y*W+x])return id}return null}function mark(board,id){let z=masks.get(id),[x1,y1,x2,y2]=z.b,cx=(x1+x2)/2,cy=(y1+y2)/2,d=document.createElement('div');d.className='mark';d.style.left=cx/W*board.clientWidth+'px';d.style.top=cy/H*board.clientHeight+'px';let s=Math.max(24,Math.min(46,Math.max(x2-x1,y2-y1)/W*board.clientWidth+8));d.style.width=d.style.height=s+'px';board.appendChild(d)}function flash(s,g){toast.textContent=s;toast.className='toast show '+(g?'good':'bad');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.className='toast',300)}function tap(e,c){if(!running)return;let id=hit(point(e,c));if(id){found.add(id);mark(ba,id);mark(bb,id);fe.textContent=found.size+'/'+active.length;flash('فرق صحيح',1);if(found.size===active.length)finish(1)}else{mistakes++;me.textContent=mistakes;flash('ضغط خارج الفرق',0)}}a.onpointerdown=e=>tap(e,a);b.onpointerdown=e=>tap(e,b);function start(){seed=parseInt(document.getElementById('seed').value)||1;active=choose(+document.getElementById('difficulty').value);found.clear();mistakes=0;remain=20;document.querySelectorAll('.mark').forEach(x=>x.remove());fe.textContent='0/'+active.length;me.textContent='0';te.textContent='20.0';render();overlay.classList.add('hidden');running=true;last=performance.now()}function finish(ok){running=false;overlay.classList.remove('hidden');card.innerHTML='<h1>'+(ok?'أحسنت':'انتهى الوقت')+'</h1><div class="result">'+found.size+'/'+active.length+'</div><p>الأخطاء: '+mistakes+'</p><button class="play" onclick="location.reload()">تجربة جديدة</button>'}function loop(n){requestAnimationFrame(loop);if(!running){last=n;return}remain-=Math.min(.05,(n-last)/1000||0);last=n;te.textContent=Math.max(0,remain).toFixed(1);if(remain<=0)finish(0)}document.getElementById('play').onclick=start;scene(A,new Set());scene(B,new Set());requestAnimationFrame(loop)})();</script></body></html>
