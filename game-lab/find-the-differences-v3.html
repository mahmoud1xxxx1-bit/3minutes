<div id="toast" class="toast"></div><div id="overlay" class="overlay"><div id="card" class="card"><h1>Find the Differences <span class="v">V3</span></h1><p>Normal = 3 فروقات، Hard = 4، Expert = 5. الـSeed يحدد العائلة والفروقات بشكل ثابت.</p><div class="row"><input id="seed" value="20260820" inputmode="numeric"><select id="difficulty"><option value="0">Normal • 3</option><option value="1">Hard • 4</option><option value="2">Expert • 5</option></select></div><button id="play" class="play" type="button">ابدأ التجربة</button><p class="note">Prototype مستقل — غير مدمج في main.</p></div></div>
<script>
(()=>{'use strict';const W=1000,H=750,a=document.getElementById('a'),b=document.getElementById('b'),A=a.getContext('2d'),B=b.getContext('2d'),boardA=document.getElementById('boardA'),boardB=document.getElementById('boardB'),overlay=document.getElementById('overlay'),card=document.getElementById('card'),toast=document.getElementById('toast'),timeEl=document.getElementById('time'),foundEl=document.getElementById('found'),mistEl=document.getElementById('mistakes'),famEl=document.getElementById('family');let active=[],found=new Set(),mistakes=0,remain=20,targetCount=3,running=false,last=0,family=0,currentSeed=20260820,scene=null;function rngFactory(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296}}function hashSeed(seed,n){let x=(seed^(n*0x45d9f3b))>>>0;x^=x>>>16;x=Math.imul(x,0x7feb352d);x^=x>>>15;x=Math.imul(x,0x846ca68b);return(x^(x>>>16))>>>0}function shuffle(arr,rnd){for(let i=arr.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2))}function shadow(ctx,blur,color,ox=0,oy=0){ctx.shadowBlur=blur;ctx.shadowColor=color;ctx.shadowOffsetX=ox;ctx.shadowOffsetY=oy}function clearShadow(ctx){ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.shadowOffsetX=0;ctx.shadowOffsetY=0}const palettes=[{wall1:'#27324a',wall2:'#151c2b',sofa:'#456c78'},{wall1:'#313546',wall2:'#191d28',sofa:'#6a596e'},{wall1:'#24343b',wall2:'#121e22',sofa:'#4d6e62'},{wall1:'#342d3d',wall2:'#1d1624',sofa:'#6d5b73'}];function buildScene(seed){const rnd=rngFactory(hashSeed(seed,91));return{palette:palettes[(rnd()*palettes.length)|0],plantSide:rnd()>.5?1:-1,artStyle:(rnd()*3)|0,lampTilt:(rnd()-.5)*.08,windowNight:rnd()>.5,booksShift:(rnd()*10)|0,floorTone:rnd()>.5?'#9a775d':'#8a6d59',stars:Array.from({length:32},()=>({x:92+rnd()*250,y:78+rnd()*175,r:.7+rnd()*1.8,a:.35+rnd()*.6}))}}const DIFFS=[{id:'clock',box:[692,86,112,112]},{id:'mug',box:[492,432,74,68]},{id:'plant',box:[82,342,96,204]},{id:'books',box:[630,246,125,90]},{id:'painting',box:[388,85,210,154]},{id:'lamp',box:[809,225,115,236]},{id:'cushion',box:[296,412,170,104]},{id:'fruit',box:[590,435,104,63]},{id:'vase',box:[219,278,54,72]},{id:'window',box:[82,80,276,177]}];const on=(set,id)=>set.has(id);function paint(ctx,mods,s){const p=s.palette,wall=ctx.createLinearGradient(0,0,W,H);wall.addColorStop(0,p.wall1);wall.addColorStop(1,p.wall2);ctx.fillStyle=wall;ctx.fillRect(0,0,W,540);const floor=ctx.createLinearGradient(0,540,0,H);floor.addColorStop(0,s.floorTone);floor.addColorStop(1,'#46372f');ctx.fillStyle=floor;ctx.fillRect(0,540,W,210);ctx.globalAlpha=.12;ctx.strokeStyle='#f4e4d6';ctx.lineWidth=2;for(let y=575;y<750;y+=38){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=-100;x<1100;x+=125){ctx.beginPath();ctx.moveTo(x,540);ctx.lineTo(x+52,750);ctx.stroke()}ctx.globalAlpha=1;shadow(ctx,24,'#0008',0,10);ctx.fillStyle='#0b111c';rr(ctx,65,63,315,220,18);ctx.fill();clearShadow(ctx);const sky=ctx.createLinearGradient(0,70,0,270),alt=on(mods,'window');sky.addColorStop(0,alt?'#6f547d':(s.windowNight?'#102a48':'#385b72'));sky.addColorStop(1,alt?'#d58d72':(s.windowNight?'#0b162d':'#c58a78'));ctx.fillStyle=sky;rr(ctx,79,77,287,192,12);ctx.fill();if(s.windowNight&&!alt){ctx.fillStyle='#dff7ff';for(const st of s.stars){ctx.globalAlpha=st.a;ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#f9e8a2';ctx.beginPath();ctx.arc(122,116,27,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17314d';ctx.beginPath();ctx.arc(136,108,29,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#ffdf92';ctx.beginPath();ctx.arc(126,120,31,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#173c35';ctx.beginPath();ctx.moveTo(80,225);ctx.quadraticCurveTo(150,150,230,218);ctx.quadraticCurveTo(300,165,366,214);ctx.lineTo(366,269);ctx.lineTo(80,269);ctx.fill();shadow(ctx,18,'#0008',0,8);ctx.fillStyle='#121927';rr(ctx,380,74,228,172,12);ctx.fill();clearShadow(ctx);ctx.fillStyle=on(mods,'painting')?'#523a68':'#18364a';rr(ctx,395,89,198,142,7);ctx.fill();if(s.artStyle===0){ctx.fillStyle='#e6ba6f';ctx.beginPath();ctx.arc(490,132,on(mods,'painting')?24:34,0,Math.PI*2);ctx.fill()}else if(s.artStyle===1){ctx.fillStyle='#d67b71';ctx.fillRect(432,111,on(mods,'painting')?68:92,20)}else{ctx.strokeStyle='#e8c88f';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(430,190);ctx.lineTo(490,on(mods,'painting')?118:145);ctx.lineTo(554,191);ctx.stroke()}ctx.fillStyle='#4d9878';ctx.beginPath();ctx.moveTo(405,220);ctx.lineTo(452,157);ctx.lineTo(498,203);ctx.lineTo(544,145);ctx.lineTo(586,220);ctx.closePath();ctx.fill();shadow(ctx,15,'#0007',0,5);ctx.fillStyle='#0d1420';ctx.beginPath();ctx.arc(748,140,62,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e2e6df';ctx.lineWidth=7;ctx.stroke();clearShadow(ctx);ctx.fillStyle='#e6ece8';ctx.beginPath();ctx.arc(748,140,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e9efeb';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(748,140);ctx.lineTo(748,100);ctx.stroke();ctx.beginPath();ctx.moveTo(748,140);ctx.lineTo(on(mods,'clock')?786:774,on(mods,'clock')?165:112);ctx.stroke();ctx.fillStyle='#5f4636';rr(ctx,192,322,145,18,6);ctx.fill();ctx.fillStyle='#4b382e';ctx.fillRect(210,338,13,132);ctx.fillRect(306,338,13,132);ctx.fillStyle=on(mods,'vase')?'#c86c73':'#d2b26e';ctx.beginPath();ctx.moveTo(226,270);ctx.quadraticCurveTo(213,330,244,349);ctx.quadraticCurveTo(276,329,262,270);ctx.closePath();ctx.fill();ctx.strokeStyle='#4e8f66';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(244,270);ctx.quadraticCurveTo(215,238,226,218);ctx.moveTo(245,270);ctx.quadraticCurveTo(274,233,268,207);ctx.stroke();ctx.fillStyle='#6fb786';ctx.beginPath();ctx.ellipse(221,225,15,28,-.7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(270,215,15,28,.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6b4a36';rr(ctx,619,224,154,16,6);ctx.fill();const cols=on(mods,'books')?['#61b9c5','#d87c77','#e2bf67']:['#61b9c5','#e2bf67','#7b91d5'];[0,1,2].forEach(i=>{ctx.fillStyle=cols[i];rr(ctx,640+i*34+(i===1?s.booksShift:0),260-i*7,23,67+i*7,4);ctx.fill()});shadow(ctx,24,'#0007',0,12);ctx.fillStyle=p.sofa;rr(ctx,246,404,388,165,32);ctx.fill();clearShadow(ctx);ctx.fillStyle='#35545f';rr(ctx,230,455,46,98,17);ctx.fill();rr(ctx,605,455,46,98,17);ctx.fill();ctx.fillStyle=on(mods,'cushion')?'#dd9d68':'#d37172';rr(ctx,302,430,93,77,18);ctx.fill();ctx.fillStyle=on(mods,'cushion')?'#d37172':'#dd9d68';rr(ctx,410,437,91,70,18);ctx.fill();shadow(ctx,15,'#0006',0,8);ctx.fillStyle='#a06a46';rr(ctx,438,514,300,31,13);ctx.fill();clearShadow(ctx);ctx.fillStyle='#6a4634';ctx.fillRect(470,544,20,92);ctx.fillRect(690,544,20,92);ctx.fillStyle=on(mods,'mug')?'#5fb8d5':'#ece9db';rr(ctx,496,436,65,60,10);ctx.fill();ctx.strokeStyle=on(mods,'mug')?'#5fb8d5':'#ece9db';ctx.lineWidth=10;ctx.beginPath();ctx.arc(558,466,18,-Math.PI/2,Math.PI/2);ctx.stroke();ctx.fillStyle='#2d414c';ctx.beginPath();ctx.ellipse(625,478,78,22,0,0,Math.PI*2);ctx.fill();[['#efc35c',594,458],['#e97876',626,454]].forEach(o=>{ctx.fillStyle=o[0];ctx.beginPath();ctx.arc(o[1],o[2],19,0,Math.PI*2);ctx.fill()});if(!on(mods,'fruit')){ctx.fillStyle='#6bc083';ctx.beginPath();ctx.arc(660,463,18,0,Math.PI*2);ctx.fill()}ctx.save();ctx.translate(857,258);ctx.rotate(s.lampTilt);ctx.strokeStyle='#cbd6d9';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,235);ctx.stroke();ctx.fillStyle=on(mods,'lamp')?'#e8aa5d':'#56a8a7';ctx.beginPath();ctx.moveTo(-50,0);ctx.lineTo(48,0);ctx.lineTo(30,65);ctx.lineTo(-31,65);ctx.closePath();ctx.fill();ctx.fillStyle='#fff0b0';ctx.beginPath();ctx.arc(0,34,11,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#b7bdc3';ctx.beginPath();ctx.ellipse(857,505,54,14,0,0,Math.PI*2);ctx.fill();const px=s.plantSide>0?82:850;ctx.fillStyle='#8d5a3d';rr(ctx,px,446,96,100,20);ctx.fill();ctx.strokeStyle='#487956';ctx.lineWidth=5;for(let i=0;i<5;i++){const ang=-1.2+i*.6;ctx.beginPath();ctx.moveTo(px+48,448);ctx.quadraticCurveTo(px+48+Math.cos(ang)*36,390,px+48+Math.cos(ang)*55,350+Math.abs(i-2)*12);ctx.stroke()}ctx.fillStyle=on(mods,'plant')?'#8cc06a':'#66b77a';for(let i=0;i<5;i++){const ang=-1.2+i*.6;ctx.beginPath();ctx.ellipse(px+48+Math.cos(ang)*55,350+Math.abs(i-2)*12,19,39,ang,0,Math.PI*2);ctx.fill()}}function renderScene(ctx,mods,s){ctx.clearRect(0,0,W,H);paint(ctx,mods,s);ctx.globalAlpha=.045;for(let y=0;y<H;y+=5)for(let x=y%10;x<W;x+=10){ctx.fillStyle=(x+y)%20===0?'#fff':'#000';ctx.fillRect(x,y,1,1)}ctx.globalAlpha=1}function choose(seed,count){return shuffle(DIFFS.map(d=>d.id),rngFactory(hashSeed(seed,17))).slice(0,count)}function diff(id){return DIFFS.find(d=>d.id===id)}function render(){scene=buildScene(currentSeed);renderScene(A,new Set(),scene);renderScene(B,new Set(active),scene)}function point(evt,canvas){const r=canvas.getBoundingClientRect();return{x:(evt.clientX-r.left)/r.width*W,y:(evt.clientY-r.top)/r.height*H}}function hit(p){for(const id of active){if(found.has(id))continue;const q=diff(id).box,x=q[0]-8,y=q[1]-8,w=q[2]+16,h=q[3]+16;if(p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h)return id}return null}function mark(board,id){const q=diff(id).box,x=(q[0]+q[2]/2)/W*board.clientWidth,y=(q[1]+q[3]/2)/H*board.clientHeight,d=document.createElement('div');d.className='mark';d.style.left=x+'px';d.style.top=y+'px';const size=Math.max(34,Math.min(70,Math.max(q[2]/W*board.clientWidth,q[3]/H*board.clientHeight)*.72));d.style.width=size+'px';d.style.height=size+'px';board.appendChild(d)}function flash(text,good){toast.textContent=text;toast.className='toast show '+(good?'good':'bad');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.className='toast',240)}function tap(evt,canvas,board){if(!running)return;const id=hit(point(evt,canvas));if(id){found.add(id);mark(boardA,id);mark(boardB,id);foundEl.textContent=`${found.size}/${targetCount}`;flash('فرق صحيح',true);if(found.size>=targetCount)finish(true)}else{mistakes++;mistEl.textContent=String(mistakes);flash('ليست منطقة اختلاف',false)}}a.addEventListener('pointerdown',e=>tap(e,a,boardA));b.addEventListener('pointerdown',e=>tap(e,b,boardB));function start(){currentSeed=(parseInt(document.getElementById('seed').value,10)||1)>>>0;targetCount=[3,4,5][+document.getElementById('difficulty').value||0];family=currentSeed%48;active=choose(currentSeed,targetCount);found.clear();mistakes=0;remain=20;document.querySelectorAll('.mark').forEach(x=>x.remove());foundEl.textContent=`0/${targetCount}`;mistEl.textContent='0';timeEl.textContent='20.0';famEl.textContent='F'+String(family+1).padStart(2,'0');render();overlay.classList.add('hidden');running=true;last=performance.now()}function finish(done){if(!running)return;running=false;overlay.classList.remove('hidden');card.innerHTML=`<h1>${done?'أحسنت':'انتهى الوقت'}</h1><div class="result">${found.size}/${targetCount}</div><p>الأخطاء: <b>${mistakes}</b><br>Family: F${String(family+1).padStart(2,'0')}</p><button class="play" id="again" type="button">تجربة جديدة</button><p class="note">Correct / Mistake / Completion فقط — لا يوجد نظام نقاط محلي.</p>`;document.getElementById('again').onclick=()=>location.reload()}function loop(now){requestAnimationFrame(loop);if(!running){last=now;return}const dt=Math.min(.05,(now-last)/1000||0);last=now;remain-=dt;timeEl.textContent=Math.max(0,remain).toFixed(1);if(remain<=0)finish(false)}document.getElementById('play').onclick=start;render();requestAnimationFrame(loop)})();
</script>
